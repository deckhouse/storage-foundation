- name: external-attacher
  link: https://github.com/kubernetes-csi/external-attacher
  description: CSI external-attacher sidecar that calls ControllerPublish/Unpublish for CSI drivers.
  logo: https://avatars.githubusercontent.com/u/52698954?s=200&v=4
  license: Apache License 2.0
  id: csi-external-attacher
  versions:
    - condition:
        k8s: ["1.20"]
      version: v4.13.0

- name: external-provisioner
  link: https://github.com/kubernetes-csi/external-provisioner
  description: CSI external-provisioner sidecar that creates and deletes CSI volumes.
  logo: https://avatars.githubusercontent.com/u/52698954?s=200&v=4
  license: Apache License 2.0
  id: csi-external-provisioner
  versions:
    # Built from upstream tag v6.3.0 + in-repo patches under patches/v6.3.0/:
    #   002-vrr-executor.patch - VolumeRestoreRequest executor with Block/
    #                            Filesystem VolumeMode support (CSI
    #                            VolumeCapabilities built from VRR spec).
    #   003-fix-cve.patch      - CVE dependency bumps (cel-go, x/crypto,
    #                            x/mod, grpc, otel).
    # 002 is the source of truth for the executor (a plain diff applied to
    # the v6.3.0 tag, excluding vendor; no long-lived fork branch). The
    # storage-foundation/api dependency is resolved with a directory replace
    # (=> ../api), so the executor always compiles against the API of the
    # commit being built; werf.inc.yaml mounts api/ next to /src.
    - condition:
        k8s: ["1.20"]
      version: v6.3.0
    - condition:
        k8s: ["1.34"]
      version: v6.3.0

- name: external-resizer
  link: https://github.com/kubernetes-csi/external-resizer
  description: CSI external-resizer sidecar that handles online and offline volume expansion.
  logo: https://avatars.githubusercontent.com/u/52698954?s=200&v=4
  license: Apache License 2.0
  id: csi-external-resizer
  versions:
    - condition:
        k8s: ["1.20"]
      version: v1.14.0
    - condition:
        k8s: ["1.34"]
      version: v2.3.0

- name: external-snapshotter (csi-snapshotter sidecar)
  link: https://github.com/kubernetes-csi/external-snapshotter
  description: CSI external-snapshotter sidecar (csi-snapshotter binary). Built by cloning the upstream tag and applying the Deckhouse vsc-only fork patch + CVE patches under images/csi-external-snapshotter/patches/<version>/.
  logo: https://avatars.githubusercontent.com/u/52698954?s=200&v=4
  license: Apache License 2.0
  id: csi-external-snapshotter
  versions:
    - condition:
        k8s: ["1.20"]
      version: v8.6.0

- name: livenessprobe
  link: https://github.com/kubernetes-csi/livenessprobe
  description: CSI liveness-probe sidecar.
  logo: https://avatars.githubusercontent.com/u/52698954?s=200&v=4
  license: Apache License 2.0
  id: csi-livenessprobe
  versions:
    - condition:
        k8s: ["1.20"]
      version: v2.20.0

- name: node-driver-registrar
  link: https://github.com/kubernetes-csi/node-driver-registrar
  description: CSI node-driver-registrar sidecar that registers the CSI driver with kubelet.
  logo: https://avatars.githubusercontent.com/u/52698954?s=200&v=4
  license: Apache License 2.0
  id: csi-node-driver-registrar
  versions:
    - condition:
        k8s: ["1.20"]
      version: v2.18.0

- name: snapshot-controller
  link: https://github.com/kubernetes-csi/external-snapshotter
  description: The controller is required for CSI snapshotting to work and is not specific to any CSI driver. Built by cloning the upstream tag and applying the Deckhouse fork patches (vsc-only mode, VolumeSnapshot dataimport) + CVE patches under images/snapshot-controller/patches/.
  logo: https://avatars.githubusercontent.com/u/52698954?s=200&v=4
  license: Apache License 2.0
  id: snapshot-controller
  version: v8.6.0

- name: volume-data-source-validator
  link: https://github.com/kubernetes-csi/volume-data-source-validator
  description: CSI volume-data-source-validator controller used by the data import flow. Built by cloning the upstream repository at a pinned commit and applying patches under images/data-source-validator/patches/ (health/readiness probes).
  logo: https://avatars.githubusercontent.com/u/52698954?s=200&v=4
  license: Apache License 2.0
  id: data-source-validator
  version: 3b807a2775747d819e8342b4ddaeac911c3c7ee2
