spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Ресурс для экспорта файлов и блоков PV.
          properties:
            spec:
              properties:
                ttl:
                  description: |
                    Время жизни после последнего запроса пользователя.
                publish:
                  description: |
                    Включение внешнего доступа к поду экспортера за пределами кластера.
                publicIngress:
                  description: |
                    Тип публичного доступа к экспортеру.
                targetRef:
                  description: |
                    Ссылка на целевой объект для экспорта. Целевой объект должен находиться в том же
                    неймспейсе, что и DataExport. PersistentVolumeClaim (PVC) и VirtualDisk можно экспортировать
                    напрямую; ресурсы снимков также можно использовать как целевые объекты экспорта.
                    Cluster-wide-ресурс VolumeSnapshotContent нельзя использовать как целевой объект экспорта.
                  properties:
                    group:
                      description: |
                        API-группа целевого объекта ("" или отсутствует для основной API-группы, например
                        для PVC).
                    kind:
                      description: |
                        Значение поля `kind` целевого объекта (например, PersistentVolumeClaim, VirtualDisk,
                        VolumeSnapshot, VirtualDiskSnapshot).
                    name:
                      description: |
                        Имя целевого объекта для экспорта.
            status:
              type: object
              description: |
                Информация о статусе DataExport.
              properties:
                url:
                  description: |
                    Внутренний URL пода экспортера (например, https://X.X.X.X:8085).
                ca:
                  description: |
                    CA-сертификат в кодировке Base64 для TLS-подключения к поду экспортера.
                publicURL:
                  description: |-
                    Публичный URL для внешнего доступа (например,
                    https://api.<PUBLIC_DOMAIN>/<NAMESPACE>/<TARGET_KIND>/<TARGET_NAME>/). `TARGET_KIND` —
                    короткое имя типа цели экспорта: pvc, vd или snap; `TARGET_NAME` — значение
                    `spec.targetRef.name`.
                accessTimestamp:
                  description: |
                    Временная метка последнего доступа к экспортированным данным.
                volumeMode:
                  description: |
                    Режим тома экспортированных данных.
                phase:
                  description: |-
                    Состояние жизненного цикла DataExport: Pending → Ready → Expired | Failed. `Terminating`
                    означает объект с установленной меткой удаления и является переходным состоянием, а не
                    результатом. `Expired` — штатное терминальное состояние после истечения периода неактивности.
                completionTimestamp:
                  description: |-
                    Время перехода DataExport в терминальную фазу (Expired или Failed). От этой метки
                    отсчитывается срок хранения.
                serverState:
                  description: |-
                    Состояние сервера экспорта: `Ready` — сервер доступен, `IdleExpired` — истёк период
                    неактивности.
                conditions:
                  type: array
                  description: |
                    Массив условий, описывающих текущее состояние DataExport.
                  items:
                    type: object
                    properties:
                      type:
                        description: |
                          Тип условия.
                      status:
                        description: |
                          Статус условия.
                      reason:
                        description: |
                          Причина текущего статуса условия.
                      message:
                        description: |
                          Сообщение, описывающее условие.
                      lastTransitionTime:
                        description: |
                          Время последнего перехода условия из одного статуса в другой.
                      observedGeneration:
                        description: |
                          Наблюдаемое поколение ресурса при последнем обновлении условия.
