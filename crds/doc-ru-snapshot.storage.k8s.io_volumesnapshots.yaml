spec:
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: |-
          VolumeSnapshot — это запрос пользователя на создание точечного снимка постоянного тома
          или на привязку к существующему снимку.
        properties:
          spec:
            description: |-
              Свойства снимка, запрошенного пользователем.

              Подробнее: https://kubernetes.io/docs/concepts/storage/volume-snapshots#volumesnapshots
            properties:
              mode:
                description: |-
                  Определяет способ получения содержимого VolumeSnapshot и не изменяется после установки.
                  Если поле не указано, при создании устанавливается `Capture`. `Capture` создаёт CSI-снимок из `spec.source`.
                  `Import` связывает VolumeSnapshot с данными, импортированными в том же неймспейсе; в этом режиме
                  `spec.source` не указывается. Расширение Deckhouse.
              source:
                description: |-
                  Указывает источник создания снимка.

                  Обязателен, если `mode` не равен `Import`. При восстановлении может быть пустым; в этом случае контроллер
                  резервного копирования может один раз установить `volumeSnapshotContentName` после успешного восстановления.
                  В остальных случаях должен быть указан ровно один из `persistentVolumeClaimName` или
                  `volumeSnapshotContentName`. Не изменяется после создания, кроме этой однократной установки из пустого значения.
                properties:
                  persistentVolumeClaimName:
                    description: |-
                      Имя объекта PersistentVolumeClaim (PVC), представляющего том,
                      из которого должен быть создан снимок.

                      PVC должен находиться в том же неймспейсе, что и объект VolumeSnapshot.

                      Указывается, если снимок не существует и его необходимо создать.

                      Неизменяемо после создания.
                  volumeSnapshotContentName:
                    description: |-
                      Имя существующего объекта VolumeSnapshotContent, представляющего существующий снимок тома.

                      Указывается, если снимок уже существует и требуется только
                      его представление в Kubernetes.

                      При восстановлении контроллер резервного копирования может один раз установить это поле, если оно было пустым, после успешного восстановления.
              volumeSnapshotClassName:
                description: |-
                  Имя VolumeSnapshotClass, запрошенного VolumeSnapshot.

                  Может быть пустым для использования класса снимков по умолчанию.
                  В кластере может быть несколько классов снимков по умолчанию: один
                  для каждого CSI-драйвера. Если класс снимков не указан,
                  проверяется VolumeSnapshotSource для определения связанного CSI-драйвера,
                  и используется класс снимков по умолчанию для этого CSI-драйвера.

                  Если для одного CSI-драйвера существует несколько VolumeSnapshotClass,
                  помеченных как используемые по умолчанию, CreateSnapshot завершается ошибкой и создает событие.

                  Не допускается пустая строка.
          status:
            description: |-
              Текущая информация о снимке.

              Перед использованием необходимо проверить успешность привязки между объектами VolumeSnapshot и
              VolumeSnapshotContent, убедившись, что оба объекта указывают друг на друга.
            properties:
              boundSnapshotContentName:
                description: |-
                  Имя кластерного объекта SnapshotContent (state-snapshotter.deckhouse.io) state-snapshotter,
                  который обеспечивает этот VolumeSnapshot как логический узел в дереве снимка.

                  Записывается общим контроллером state-snapshotter в дополнение к boundVolumeSnapshotContentName.
                  Расширение Deckhouse.
              boundVolumeSnapshotContentName:
                description: |-
                  Имя объекта VolumeSnapshotContent, к которому привязан этот объект VolumeSnapshot.

                  Если не указано, объект VolumeSnapshot еще не привязан к объекту VolumeSnapshotContent.

                  **Примечание:** для предотвращения проблем с безопасностью перед использованием необходимо проверить
                  успешность привязки между объектами VolumeSnapshot и VolumeSnapshotContent, убедившись,
                  что оба объекта указывают друг на друга.
              captureState:
                description: |-
                  Состояние захвата снимка, когда VolumeSnapshot участвует в дереве снимков.
                  Расширение Deckhouse.
                properties:
                  commonController:
                    description: |-
                      Состояние захвата, общее для дерева снимков.
                    properties:
                      dataCaptured:
                        description: |-
                          Указывает, успешно ли захвачены данные тома.
                      manifestCaptured:
                        description: |-
                          Указывает, успешно ли захвачены манифесты этого узла снимка.
                      childSubtreesManifestsPersisted:
                        description: |-
                          Указывает, сохранены ли манифесты всех дочерних снимков.
                      childrenSettled:
                        description: |-
                          Указывает, достигли ли все непосредственные дочерние снимки терминального состояния.
                      subtreePlanned:
                        description: |-
                          Указывает, завершено ли планирование этого снимка и его дочерних узлов.
                  domainSpecificController:
                    description: |-
                      Ссылки планирования и состояние жизненного цикла для конкретного домена.
                    properties:
                      excludedRefs:
                        description: |-
                          Прямые исключения, наложенные доменом на этом узле (исходные объекты, которые он
                          отбросил по метке исключения при перечислении своих потомков).
                        items:
                          description: |-
                            Ссылка на исключённый исходный объект ({apiVersion,kind,name}); неймспейс подразумевается
                            (неймспейс снимка).
                      manifestCaptureRequestName:
                        description: |-
                          Имя запроса захвата манифестов, связанного с этим узлом снимка.
                      message:
                        description: |-
                          Человекочитаемые подробности для phase=Failed.
                      phase:
                        description: |-
                          Фаза жизненного цикла узла снимка.
                      reason:
                        description: |-
                          Короткая машиночитаемая причина для phase=Failed (произвольная строка домена).
                      volumeCaptureRequestName:
                        description: |-
                          Имя запроса захвата тома, связанного с этим узлом снимка.
              childrenSnapshotRefs:
                description: |-
                  Прямые рёбра к дочерним снимкам, когда этот VolumeSnapshot участвует в дереве снимка.
                  VolumeSnapshot является листом данных, поэтому обычно поле пустое; оно сохраняется
                  для единообразия между видами снимков. Расширение Deckhouse.
                items:
                  description: |-
                    Ссылка на дочерний объект снимка ({apiVersion,kind,name}) в дереве запуска; неймспейс
                    подразумевается (неймспейс родительского Snapshot).
              conditions:
                description: |-
                  Условия отражают готовность протокола state-snapshotter (conditions[Ready] — единственное
                  пользовательское условие, вычисляемое ядром) и отличаются от сигнала привязки CSI readyToUse.
                  Записываются ядром state-snapshotter. Расширение Deckhouse.
                items:
                  description: |-
                    Условие содержит подробности одного аспекта текущего состояния этого ресурса API.
                  properties:
                    lastTransitionTime:
                      description: |-
                        Время последнего перехода условия из одного статуса в другой.
                        Оно должно соответствовать моменту изменения базового условия. Если этот момент неизвестен, допустимо использовать время изменения поля API.
                    message:
                      description: |-
                        Человекочитаемое сообщение с подробностями о переходе.
                        Может быть пустой строкой.
                    observedGeneration:
                      description: |-
                        Значение `.metadata.generation`, на основе которого было выставлено условие.
                        Например, если `.metadata.generation` сейчас равно 12, а `.status.conditions[x].observedGeneration` — 9, условие устарело
                        относительно текущего состояния экземпляра.
                    reason:
                      description: |-
                        Программный идентификатор причины последнего перехода условия.
                        Производители конкретных типов условий могут определять ожидаемые значения и смысл этого поля,
                        а также то, считаются ли эти значения гарантированной частью API.
                        Значение должно быть строкой в формате CamelCase.
                        Поле не может быть пустым.
                    status:
                      description: |-
                        Статус условия — True, False или Unknown.
                    type:
                      description: |-
                        Тип условия в формате CamelCase или foo.example.com/CamelCase.
              creationTime:
                description: |-
                  Временная метка создания точечного снимка нижележащей системой хранения.

                  При динамическом создании снимка заполняется контроллером снимков
                  значением `creation_time`, возвращаемым из вызова gRPC `CreateSnapshot` CSI.

                  Для существующего снимка заполняется значением `creation_time`,
                  возвращаемым из вызова gRPC `ListSnapshots` CSI, если драйвер поддерживает это.

                  Если не указано, время создания снимка неизвестно.
              data:
                description: |-
                  Самодостаточная привязка данных (sourceRef + artifactRef + метаданные тома), зеркалируемая
                  из связанного `SnapshotContent.status.data`, чтобы описание захваченного тома можно было
                  получить из этого VolumeSnapshot в неймспейсе. Расширение Deckhouse.
                properties:
                  artifactRef:
                    description: Сохраняемый артефакт данных (VolumeSnapshotContent).
                  fsType:
                    description: Тип файловой системы источника (только для томов Filesystem).
                  size:
                    description: Реальный выделенный размер захваченного тома (например, "10Gi").
                  sourceRef:
                    description: Захваченный исходный PVC (uid — идентичность тома).
                  storageClassName:
                    description: StorageClass исходного захваченного тома.
                  volumeMode:
                    description: Режим тома источника (Block или Filesystem).
              error:
                description: |-
                  Последняя наблюдаемая ошибка при создании снимка, если есть.

                  Полезно контроллерам верхнего уровня (например, контроллеру приложения),
                  чтобы определить по типу ошибки, следует ли продолжать ожидание создания снимка.
                  Контроллер снимков продолжает повторные попытки при возникновении ошибки во время
                  создания снимка.

                  После успешного создания поле очищается.
                properties:
                  message:
                    description: |-
                      Детали возникшей ошибки при создании снимка, если указаны.

                      **Примечание:** сообщение может быть записано в журнал и не должно содержать конфиденциальную информацию.
                  time:
                    description: |-
                      Временная метка, когда была обнаружена ошибка.
              readyToUse:
                description: |-
                  Указывает, готов ли снимок для восстановления тома.

                  При динамическом создании снимка заполняется контроллером снимков
                  значением `ready_to_use`, возвращаемым из вызова gRPC `CreateSnapshot` CSI.

                  Для существующего снимка заполняется значением `ready_to_use`,
                  возвращаемым из вызова gRPC `ListSnapshots` CSI, если драйвер поддерживает это,
                  иначе устанавливается в `True`.

                  Если не указано, готовность снимка неизвестна.
              restoreSize:
                description: |-
                  Минимальный размер тома, необходимый для создания тома из этого снимка.

                  При динамическом создании снимка заполняется контроллером снимков
                  значением `size_bytes`, возвращаемым из вызова gRPC `CreateSnapshot` CSI.

                  Для существующего снимка заполняется значением `size_bytes`,
                  возвращаемым из вызова gRPC `ListSnapshots` CSI, если драйвер поддерживает это.

                  При восстановлении тома из этого снимка размер тома **не должен**
                  быть меньше `restoreSize`, если он указан, иначе восстановление завершится ошибкой.

                  Если не указано, размер неизвестен.
              sourceRef:
                description: |-
                  Полная ссылка на захваченный исходный объект (исходный PVC). Достаточна для
                  воссоздания в режиме импорта. Расширение Deckhouse.
                properties:
                  namespace:
                    description: |-
                      Неймспейс исходного объекта (только для источников на уровне неймспейса).
                  uid:
                    description: |-
                      UID исходного объекта, из которого был создан снимок (заполняется по возможности; используется d8-cli
                      для воссоздания в режиме импорта).
              volumeGroupSnapshotName:
                description: |-
                  Имя VolumeGroupSnapshot, частью которого является этот VolumeSnapshot.
  - name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          VolumeSnapshot — это запрос пользователя на создание точечного снимка постоянного тома
          или на привязку к существующему снимку.
        properties:
          spec:
            description: |-
              Свойства снимка, запрошенного пользователем.

              Подробнее: https://kubernetes.io/docs/concepts/storage/volume-snapshots#volumesnapshots
            properties:
              source:
                description: |-
                  Указывает источник создания снимка.

                  Может быть пустым при восстановлении. После успешного восстановления контроллер резервного копирования может один раз установить `volumeSnapshotContentName`.
                  Иначе должен быть указан ровно один из persistentVolumeClaimName или volumeSnapshotContentName.

                  Неизменяемо после создания (кроме одноразовой установки volumeSnapshotContentName из пустого).
                properties:
                  persistentVolumeClaimName:
                    description: |-
                      Имя PVC, представляющего том,
                      из которого должен быть создан снимок.

                      PVC должен находиться в том же неймспейсе, что и объект VolumeSnapshot.

                      Указывается, если снимок не существует и его необходимо создать.

                      Неизменяемо после создания.
                  volumeSnapshotContentName:
                    description: |-
                      Имя существующего объекта VolumeSnapshotContent, представляющего существующий снимок тома.

                      Указывается, если снимок уже существует и требуется только
                      его представление в Kubernetes.

                      При восстановлении контроллер резервного копирования может один раз установить это поле, если оно было пустым, после успешного восстановления.
              volumeSnapshotClassName:
                description: |-
                  Имя VolumeSnapshotClass, запрошенного VolumeSnapshot.

                  Может быть пустым для использования класса снимков по умолчанию.

                  В кластере может быть несколько классов снимков по умолчанию: один
                  для каждого CSI-драйвера. Если класс снимков не указан,
                  проверяется VolumeSnapshotSource для определения связанного CSI-драйвера,
                  и используется класс снимков по умолчанию для этого CSI-драйвера.

                  Если для одного CSI-драйвера существует несколько VolumeSnapshotClass,
                  помеченных как используемые по умолчанию, CreateSnapshot завершается ошибкой и создает событие.

                  Не допускается пустая строка.
          status:
            description: |-
              Текущая информация о снимке.

              Перед использованием необходимо проверить успешность привязки между объектами VolumeSnapshot и
              VolumeSnapshotContent, убедившись, что оба объекта указывают друг на друга.
            properties:
              boundVolumeSnapshotContentName:
                description: |-
                  Имя объекта VolumeSnapshotContent, к которому привязан этот объект VolumeSnapshot.

                  Если не указано, объект VolumeSnapshot еще не привязан к объекту VolumeSnapshotContent.

                  **Примечание:** для предотвращения проблем с безопасностью перед использованием необходимо проверить
                  успешность привязки между объектами VolumeSnapshot и VolumeSnapshotContent, убедившись,
                  что оба объекта указывают друг на друга.
              creationTime:
                description: |-
                  Временная метка создания точечного снимка нижележащей системой хранения.

                  При динамическом создании снимка заполняется контроллером снимков
                  значением `creation_time`, возвращаемым из вызова gRPC `CreateSnapshot` CSI.

                  Для существующего снимка заполняется значением `creation_time`,
                  возвращаемым из вызова gRPC `ListSnapshots` CSI, если драйвер поддерживает это.

                  Если не указано, время создания снимка неизвестно.
              error:
                description: |-
                  Последняя наблюдаемая ошибка при создании снимка, если есть.

                  Полезно контроллерам верхнего уровня (например, контроллеру приложения),
                  чтобы определить по типу ошибки, следует ли продолжать ожидание создания снимка.
                  Контроллер снимков продолжает повторные попытки при возникновении ошибки во время
                  создания снимка.

                  После успешного создания поле очищается.
                properties:
                  message:
                    description: |-
                      Детали возникшей ошибки при создании снимка, если указаны.

                      **Примечание:** сообщение может быть записано в журнал и не должно содержать конфиденциальную информацию.
                  time:
                    description: |-
                      Временная метка, когда была обнаружена ошибка.
              readyToUse:
                description: |-
                  Указывает, готов ли снимок для восстановления тома.

                  При динамическом создании снимка заполняется контроллером снимков
                  значением `ready_to_use`, возвращаемым из вызова gRPC `CreateSnapshot` CSI.

                  Для существующего снимка заполняется значением `ready_to_use`,
                  возвращаемым из вызова gRPC `ListSnapshots` CSI, если драйвер поддерживает это,
                  иначе устанавливается в `True`.

                  Если не указано, готовность снимка неизвестна.
              restoreSize:
                description: |-
                  Минимальный размер тома, необходимый для создания тома из этого снимка.

                  При динамическом создании снимка заполняется контроллером снимков
                  значением `size_bytes`, возвращаемым из вызова gRPC `CreateSnapshot` CSI.

                  Для существующего снимка заполняется значением `size_bytes`,
                  возвращаемым из вызова gRPC `ListSnapshots` CSI, если драйвер поддерживает это.

                  При восстановлении тома из этого снимка размер тома **не должен**
                  быть меньше `restoreSize`, если он указан, иначе восстановление завершится ошибкой.

                  Если не указано, размер неизвестен.
              volumeGroupSnapshotName:
                description: |-
                  Имя VolumeGroupSnapshot, частью которого является этот VolumeSnapshot.
