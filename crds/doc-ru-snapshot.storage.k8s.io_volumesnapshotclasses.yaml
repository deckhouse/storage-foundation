spec:
  versions:
  - name: v1
    additionalPrinterColumns:
    - {}
    - description: Управляет удалением VolumeSnapshotContent и его физического снимка при удалении связанного VolumeSnapshot.
    schema:
      openAPIV3Schema:
        description: |-
          VolumeSnapshotClass определяет параметры для создания снимков томов, используемые
          нижележащей системой хранения.

          Для использования укажите имя VolumeSnapshotClass
          в объекте VolumeSnapshot.
        properties:
          deletionPolicy:
            description: |-
              Управляет поведением при удалении VolumeSnapshotContent и его физического снимка
              при удалении связанного VolumeSnapshot.

              Поддерживаемые значения:

              - `Retain` — VolumeSnapshotContent и его физический снимок в нижележащей системе хранения сохраняются.
              - `Delete` — VolumeSnapshotContent и его физический снимок в нижележащей системе хранения удаляются.
          driver:
            description: |-
              Имя драйвера хранения, который обрабатывает этот VolumeSnapshotClass.
          parameters:
            description: |-
              Карта ключ-значение с параметрами, специфичными для драйвера хранения, используемыми при создании снимков.

              Kubernetes не интерпретирует эти параметры.
  - name: v1beta1
    additionalPrinterColumns:
    - {}
    - description: Управляет удалением VolumeSnapshotContent и его физического снимка при удалении связанного VolumeSnapshot.
    schema:
      openAPIV3Schema:
        description: |-
          VolumeSnapshotClass определяет параметры для создания снимков томов, используемые
          нижележащей системой хранения.

          Для использования укажите имя VolumeSnapshotClass
          в объекте VolumeSnapshot.
        properties:
          deletionPolicy:
            description: |-
              Управляет поведением при удалении VolumeSnapshotContent и его физического снимка
              при удалении связанного VolumeSnapshot.
              Поддерживаемые значения:

              - `Retain` —  VolumeSnapshotContent и его физический снимок в нижележащей системе хранения сохраняются.
              - `Delete` —  VolumeSnapshotContent и его физический снимок в нижележащей системе хранения удаляются.
          driver:
            description: |-
              Имя драйвера хранения, который обрабатывает этот VolumeSnapshotClass.
          parameters:
            description: |-
              Карта ключ-значение с параметрами, специфичными для драйвера хранения, используемыми при создании снимков.

              Kubernetes не интерпретирует эти параметры.