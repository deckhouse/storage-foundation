spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |-
            Ресурс для импорта данных в новый PersistentVolumeClaim (PVC) (CreatePVC) или создания сохраняемого артефакта
            данных для существующего узла снимка (PopulateData).
          properties:
            spec:
              properties:
                ttl:
                  description: |-
                    Время жизни после последнего запроса пользователя.

                    Допустимые значения:

                    - `<number>s`
                    - `<number>m`
                    - `<number>h`

                    Например, `5m`, `2h45m` или `24h`.
                publish:
                  description: |
                    Включение внешнего доступа к импортер-поду за пределами кластера.
                waitForFirstConsumer:
                  description: |-
                    Определяет, чего импорт ждёт перед началом переноса данных в целевой PVC. Если у
                    StorageClass целевого PVC параметр `volumeBindingMode` равен `WaitForFirstConsumer` и это
                    поле равно `true`, импорт ждёт, пока не будет запланирован под, монтирующий целевой PVC,
                    а затем размещает импортируемый том на соответствующем узле. Если значение `false`, импорт
                    продолжает работу, не дожидаясь появления потребителя, и сам становится первым потребителем тома. Не имеет эффекта, если StorageClass целевого PVC
                    не откладывает привязку до появления потребителя.
                mode:
                  description: |-
                    Определяет назначение импортируемых данных:

                    - `CreatePVC`: запись данных в новый PVC (`pvcTemplate`). Сохраняемый артефакт данных не создаётся.
                    - `PopulateData`: запись данных в соответствии с `storageParams` и создание сохраняемого
                      VolumeSnapshotContent для существующего узла снимка, указанного в `snapshotRef`.
                snapshotRef:
                  description: |-
                    Только для режима `PopulateData`. Ссылка на существующий узел снимка, которому принадлежит
                    создаваемый сохраняемый артефакт данных. Неймспейс совпадает с неймспейсом DataImport.
                  properties:
                    apiVersion:
                      description: |
                        Группа/версия узла-снимка (например, `snapshot.storage.k8s.io/v1`).
                    kind:
                      description: |
                        Вид узла-снимка (например, `VolumeSnapshot`, `VirtualDiskSnapshot`).
                    name:
                      description: |
                        Имя узла-снимка.
                storageParams:
                  description: |-
                    Только для режима `PopulateData`. Параметры хранилища для создания сохраняемого
                    VolumeSnapshotContent. StorageClass должен поддерживать снимки через VolumeSnapshotClass.
                  properties:
                    storageClassName:
                      description: |
                        StorageClass временного PVC (должен поддерживать снимки).
                    size:
                      description: |
                        Запрашиваемый размер временного PVC (величина Kubernetes, например `10Gi`).
                    volumeMode:
                      description: |
                        Режим тома временного PVC. По умолчанию `Filesystem`.
                pvcTemplate:
                  description: |
                    Только для режима CreatePVC. Шаблон PVC, полностью описывающий целевой PVC, в который записываются импортируемые данные; PVC сохраняется после импорта.
                  properties:
                    metadata:
                      description: |
                        Метаданные PVC.
                      properties:
                        name:
                          description: |
                            Имя PVC.
                        labels:
                          description: |
                            Метки PVC.
                        annotations:
                          description: |
                            Аннотации PVC.
                    spec:
                      description: |
                        Спецификация PVC.
                      properties:
                        accessModes:
                          description: |
                            Желаемые режимы доступа к тому.
                        resources:
                          description: |
                            Минимальные требования к ресурсам тома.
                          properties:
                            requests:
                              description: |
                                Минимальный объём требуемых вычислительных ресурсов.
                        storageClassName:
                          description: |
                            Имя StorageClass, требуемого PVC. Если не указано,
                            используется StorageClass по умолчанию кластера — в том числе назначенный
                            позже; импорт ждёт его назначения. Пустая строка не поддерживается: том
                            должен создаваться динамически.
                        volumeMode:
                          description: |
                            Режим тома, требуемый для PVC.
            status:
              description: |
                Информация о статусе DataImport.
              properties:
                url:
                  description: |
                    Внутренний URL-адрес сервиса импортера.
                ca:
                  description: |
                    CA-сертификат в кодировке Base64 для TLS-соединения с импортер-подом.
                publicURL:
                  description: |
                    Публичный URL-адрес сервиса импортера.
                accessTimestamp:
                  description: |
                    Временная метка последнего доступа, обновляемая импортер-подом.
                volumeMode:
                  description: |
                    Режим тома импортированных данных.
                phase:
                  description: |-
                    Состояние жизненного цикла DataImport: Pending → Ready → Completed | Expired | Failed.
                    `Terminating` означает объект с установленной меткой удаления и является переходным
                    состоянием, а не результатом. `Expired` — штатное терминальное состояние после истечения
                    периода неактивности.
                completionTimestamp:
                  description: |-
                    Время перехода DataImport в терминальную фазу (Completed, Expired или Failed). От этой
                    метки отсчитывается срок хранения.
                serverState:
                  description: |-
                    Состояние сервера импорта: `Ready` — сервер доступен, `Finished` — загрузка завершена,
                    `IdleExpired` — истёк период неактивности.
                data:
                  description: |-
                    Информация о сохраняемом артефакте данных, созданном этим импортом.
                  properties:
                    artifactRef:
                      description: |-
                        Ссылка на сохраняемый артефакт данных (VolumeSnapshotContent), созданный этим импортом.
                      properties:
                        uid:
                          description: |-
                            UID сохраняемого артефакта данных (например, UID VolumeSnapshotContent). Необязательное
                            поле; заполняется при наличии значения.
                    fsType:
                      description: |-
                        Тип файловой системы импортированных данных. Пустое значение означает, что тип файловой
                        системы неизвестен или неприменим для блочного тома.
                conditions:
                  type: array
                  items:
                    type: object
                    description: Массив условий, описывающих текущее состояние DataImport.
                    properties:
                      type:
                        description: |
                          Тип условия.
                      status:
                        description: |
                          Статус условия.
                      reason:
                        description: |
                          Причина текущего статуса условия.
                      message:
                        description: |
                          Человекочитаемое сообщение с подробностями о переходе статуса.

                          Может быть пустой строкой.
                      lastTransitionTime:
                        description: |
                          Время последнего перехода условия из одного статуса в другой.

                          Обычно соответствует моменту изменения базового условия.
                          Если время последнего перехода неизвестно, допускается использование времени изменения поля API.
                      observedGeneration:
                        description: |
                          Значение `.metadata.generation`, на основе которого было установлено условие.

                          Например, если текущее значение `.metadata.generation` равно 12, а `.status.conditions[x].observedGeneration` равно 9, то статус условия не соответствует текущему состоянию ресурса.
