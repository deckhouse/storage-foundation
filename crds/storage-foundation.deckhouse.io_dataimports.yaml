apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    backup.deckhouse.io/cluster-config: "true"
    heritage: deckhouse
    module: storage-foundation
  name: dataimports.storage-foundation.deckhouse.io
spec:
  group: storage-foundation.deckhouse.io
  names:
    kind: DataImport
    plural: dataimports
    shortNames:
    - di
    singular: dataimport
  preserveUnknownFields: false
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.url
      name: URL
      type: string
    - jsonPath: .status.publicURL
      name: Public URL
      type: string
    - jsonPath: .spec.ttl
      name: TTL
      priority: 1
      type: string
    - jsonPath: .spec.mode
      name: Mode
      priority: 1
      type: string
    - jsonPath: .spec.storageParams.storageClassName
      name: Storage Class
      priority: 1
      type: string
    - jsonPath: .spec.waitForFirstConsumer
      name: Wait For Consumer
      priority: 1
      type: boolean
    - description: The status of DataImport.
      jsonPath: .status.phase
      name: Status
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Resource for importing data into a newly created PVC (CreatePVC) or producing a durable data
          artifact for an already-existing snapshot node (PopulateData).
        properties:
          spec:
            properties:
              mode:
                default: CreatePVC
                description: |-
                  Discriminator selecting what the import does with the bytes:

                  - `CreatePVC`: write into a preserved, newly created PVC (`pvcTemplate`). No durable
                    artifact.
                  - `PopulateData`: write the bytes according to `storageParams` and produce a durable
                    VolumeSnapshotContent for the existing snapshot node referenced by `snapshotRef`.
                enum:
                - CreatePVC
                - PopulateData
                type: string
              publish:
                default: false
                description: Expose the importer pod outside the cluster.
                type: boolean
              pvcTemplate:
                description: |-
                  CreatePVC only. PersistentVolumeClaim template fully describing the target PVC the
                  imported bytes are written into; the PVC is preserved after the import.
                properties:
                  metadata:
                    description: PersistentVolumeClaim metadata.
                    properties:
                      annotations:
                        additionalProperties:
                          type: string
                        description: PersistentVolumeClaim annotations.
                        type: object
                      labels:
                        additionalProperties:
                          type: string
                        description: PersistentVolumeClaim labels.
                        type: object
                      name:
                        description: PersistentVolumeClaim name.
                        type: string
                    type: object
                  spec:
                    description: PersistentVolumeClaim specification.
                    properties:
                      accessModes:
                        description: Desired access modes for the volume.
                        items:
                          enum:
                          - ReadWriteOnce
                          - ReadOnlyMany
                          - ReadWriteMany
                          - ReadWriteOncePod
                          type: string
                        type: array
                      resources:
                        description: Minimum resource requirements for the volume.
                        properties:
                          requests:
                            additionalProperties:
                              anyOf:
                              - type: integer
                              - type: string
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            description: Minimum amount of compute resources required.
                            type: object
                        type: object
                      storageClassName:
                        description: |-
                          Name of the StorageClass required by the PersistentVolumeClaim. When omitted,
                          the cluster's default StorageClass is used — also when it is marked default
                          later; the import waits until then. An empty string is not supported: the
                          volume has to be dynamically provisioned.
                        minLength: 1
                        type: string
                      volumeMode:
                        description: Volume mode required by the PersistentVolumeClaim.
                        enum:
                        - Block
                        - Filesystem
                        type: string
                    type: object
                type: object
              snapshotRef:
                description: |-
                  PopulateData only. Reference to the existing snapshot node that owns the produced durable
                  artifact. The namespace is implicitly the DataImport namespace.
                properties:
                  apiVersion:
                    description: Group/version of the snapshot node (e.g. `snapshot.storage.k8s.io/v1`).
                    type: string
                  kind:
                    description: Kind of the snapshot node (e.g. `VolumeSnapshot`,
                      `VirtualDiskSnapshot`).
                    minLength: 1
                    type: string
                  name:
                    description: Name of the snapshot node.
                    minLength: 1
                    type: string
                required:
                - kind
                - name
                type: object
                x-kubernetes-validations:
                - message: snapshotRef is immutable
                  rule: self == oldSelf
              storageParams:
                description: |-
                  PopulateData only. Storage parameters used to produce the durable VolumeSnapshotContent.
                  The StorageClass must support snapshots through a VolumeSnapshotClass.
                properties:
                  size:
                    description: Requested size of the scratch PVC (a Kubernetes quantity,
                      e.g. `10Gi`).
                    minLength: 1
                    type: string
                  storageClassName:
                    description: StorageClass of the scratch PVC (must be snapshot-capable).
                    minLength: 1
                    type: string
                  volumeMode:
                    description: Volume mode of the scratch PVC. Defaults to `Filesystem`
                      when omitted.
                    enum:
                    - Block
                    - Filesystem
                    type: string
                required:
                - size
                - storageClassName
                type: object
              ttl:
                description: |-
                  Time-to-live duration after the last user request.

                  Acceptable values:

                  - `<number>s`
                  - `<number>m`
                  - `<number>h`

                  For example, `5m`, `2h45m`, or `24h`.
                pattern: ^([0-9]+(\.[0-9]+)?h)?([0-9]+(\.[0-9]+)?m)?([0-9]+s)?$
                type: string
              waitForFirstConsumer:
                default: true
                description: |-
                  Controls what the import waits for before it starts moving data into the target PVC.
                  When the target PVC's StorageClass has `volumeBindingMode: WaitForFirstConsumer` and
                  this field is `true`, the import waits until a pod that mounts the
                  target PVC is scheduled, then places the imported volume on the node that pod was
                  scheduled to. When `false`, the import does not wait for a consumer and becomes the
                  volume's first consumer itself. Has no effect when the
                  target PVC's StorageClass does not delay binding until a consumer appears.
                type: boolean
            required:
            - ttl
            type: object
            x-kubernetes-validations:
            - message: mode PopulateData requires snapshotRef and storageParams.
              rule: self.mode != 'PopulateData' || (has(self.snapshotRef) && has(self.storageParams))
            - message: mode PopulateData forbids pvcTemplate.
              rule: self.mode != 'PopulateData' || !has(self.pvcTemplate)
            - message: mode CreatePVC requires pvcTemplate.
              rule: self.mode != 'CreatePVC' || has(self.pvcTemplate)
            - message: mode CreatePVC forbids snapshotRef and storageParams.
              rule: self.mode != 'CreatePVC' || (!has(self.snapshotRef) && !has(self.storageParams))
            - message: pvcTemplate requires metadata.name.
              rule: '!has(self.pvcTemplate) || (has(self.pvcTemplate.metadata) &&
                has(self.pvcTemplate.metadata.name) && size(self.pvcTemplate.metadata.name)
                > 0)'
            - message: mode is immutable
              rule: self.mode == oldSelf.mode
          status:
            description: Status information for DataImport.
            properties:
              accessTimestamp:
                description: Last access timestamp updated by the importer pod.
                format: date-time
                type: string
              ca:
                description: Base64-encoded CA certificate for establishing a TLS
                  connection to the importer pod.
                type: string
              completionTimestamp:
                description: Time the DataImport reached a terminal phase (Completed,
                  Expired or Failed). Retention age is measured from this timestamp.
                format: date-time
                type: string
              conditions:
                items:
                  description: Array of conditions describing the current state of
                    DataImport.
                  properties:
                    lastTransitionTime:
                      description: |-
                        Last time the condition transitioned from one status to another.

                        This should be when the underlying condition changed.
                        If the last transition time is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        Human-readable message indicating details about the transition.

                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        The `.metadata.generation` that the condition was set based upon.

                        For instance, if `.metadata.generation` is currently 12, but the `.status.conditions[x].observedGeneration` is 9, the condition is out of date.
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: Current condition status reason.
                      enum:
                      - Pending
                      - PVCCreated
                      - ServerReady
                      - InProgress
                      - Expired
                      - Deleted
                      - UploadFinished
                      - Completed
                      - Failed
                      - TargetFailed
                      - CleanupFailed
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: Condition status.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: Condition type.
                      enum:
                      - Ready
                      - UploadFinished
                      - Completed
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              data:
                description: Information about the durable data artifact produced
                  by this import.
                properties:
                  artifactRef:
                    description: Reference to the durable data artifact produced by
                      this import (a VolumeSnapshotContent).
                    properties:
                      apiVersion:
                        type: string
                      kind:
                        type: string
                      name:
                        type: string
                      uid:
                        description: UID of the durable data artifact (for example,
                          the VolumeSnapshotContent UID). Optional and populated when
                          available.
                        type: string
                    type: object
                  fsType:
                    description: Filesystem type of the imported data. Empty means
                      that the filesystem type is unknown or not applicable for a
                      Block volume.
                    type: string
                type: object
              phase:
                description: 'Lifecycle state of the DataImport: Pending → Ready →
                  Completed | Expired | Failed. `Terminating` denotes an object with
                  a deletion timestamp and is a transient state, not an outcome. `Expired`
                  is a normal terminal outcome when the idle-TTL window elapses.'
                enum:
                - Pending
                - Ready
                - Completed
                - Expired
                - Failed
                - Terminating
                type: string
              publicURL:
                description: Public URL of the importer service.
                type: string
              serverState:
                description: 'Importer server state: `Ready` when the server is available,
                  `Finished` when the upload has completed, and `IdleExpired` when
                  the idle-TTL window has elapsed.'
                enum:
                - Ready
                - Finished
                - IdleExpired
                type: string
              url:
                description: Internal URL of the importer service.
                type: string
              volumeMode:
                description: Volume mode of the imported data.
                enum:
                - Block
                - Filesystem
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
