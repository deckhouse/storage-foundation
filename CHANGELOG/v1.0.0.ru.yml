Изменения:
  - Первый релиз, уровень General Availability. Модуль предоставляет поддержку снимков и
    клонирования томов для совместимых CSI-драйверов, а также экспорт и импорт данных томов по HTTP —
    как внутри кластера, так и снаружи через ingress.
  - Автовключается в бандлах Default и Managed. Требует Deckhouse >= 1.76.9 и модуль
    state-snapshotter >= 1.0.0.
  - Модуль берёт на себя функциональность snapshot-controller, поэтому для корректной работы требует,
    чтобы тот отсутствовал в кластере или был выключен — либо был обновлён до версии не ниже 0.2.0.
  - Модуль storage-volume-data-manager можно держать включённым одновременно — каждый из двух
    обслуживает свои собственные ресурсы DataExport/DataImport, в своей API-группе и своём
    пространстве имён. Один и тот же живой том нельзя экспортировать через оба сразу.
  - VolumeSnapshot расширен — вместе с данными тома в снимке сохраняется и манифест PVC, из которого
    он сделан.
