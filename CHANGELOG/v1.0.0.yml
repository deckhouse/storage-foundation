Changes:
  - First release, at the General Availability level. The module provides snapshot and volume cloning
    support for compatible CSI drivers, as well as export and import of volume data over HTTP, both
    inside the cluster and outside it through the ingress.
  - Enabled automatically in the Default and Managed bundles. Requires Deckhouse >= 1.76.9 and the
    state-snapshotter module >= 1.0.0.
  - The module takes over the functionality of snapshot-controller, so for correct operation it
    requires that module to be absent or disabled, or updated to 0.2.0 or newer.
  - The storage-volume-data-manager module may be kept enabled at the same time; each of the two
    serves its own DataExport/DataImport resources, in its own API group and its own namespace. The
    same live volume cannot be exported through both at once.
  - VolumeSnapshot is extended, so a snapshot keeps both the volume data and the manifest of the PVC
    it was made from.
