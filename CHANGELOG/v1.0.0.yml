Changes:
- General Availability level release. storage-foundation becomes the owner of support
  for CSI snapshots (extended VolumeSnapshot with spec.mode), volume cloning and DataExport/DataImport
  data export/import via HTTP in the cluster.
- Auto-enabled in Default and Managed bundles; requires Deckhouse >= 1.76.9 (release
  with d8 compatible CLI) and state-snapshotter module >= 1.0.0.
- The legacy module snapshot-controller (v0.2.0+) is pinned to this version v1.0.0
  and transfers its functionality to the storage-foundation module.
- The storage-volume-data-manager module remains supported, it can be kept enabled
  simultaneously with storage-foundation - each of the two modules maintains its own
  DataExport/DataImport resources independently, in its own API group and in its own
  namespace. The same live volume still cannot be exported through both modules at
  the same time (see documentation for using the module).
- Added CI check hack/check-consumer-crds.sh, which protects against byte-to-byte
  discrepancies between the CRD of this module and their copies in other modules -
  snapshot CRDs transmitted by the snapshot-controller module, and the vendor CRD
  VolumePopulators, which is installed by both storage-foundation and storage-volume-data-manager
