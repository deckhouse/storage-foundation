version: "2"
run:
  timeout: 10m
  allow-parallel-runners: true
  # golangci-lint v2.9.0 (the version the go_linter job installs) is built with
  # go1.25 and refuses to lint modules whose go directive is higher. Pin the target
  # language version so it does not read 1.26.5 from go.mod and fail with "the Go
  # language version (go1.25) used to build golangci-lint is lower than the
  # targeted Go version".
  go: "1.25"
linters:
  default: none
  enable:
    - copyloopvar
    - dogsled
    - errcheck
    - gocritic
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unparam
    - whitespace
  settings:
    errcheck:
      exclude-functions:
        - 'fmt:.*'
        - '[rR]ead|[wW]rite|[cC]lose'
        - 'io:Copy'
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: (.+)\.go$
        text: ST1005.*
      - path: (.+)\.go$
        text: should not use dot imports
      - path: (.+)\.go$
        text: don't use an underscore in package name
      - path: (.+)\.go$
        text: 'exported: .*'
      - path: (.+)\.go$
        text: QF1008.*
      - path: (.+)\.go$
        text: QF1003.*
      - path: (.+)\.go$
        text: SA1019.*
      - path: (.+)\.go$
        text: 'ifElseChain: .*'
      - path: (.+)\.go$
        text: .* always receives .*
      - path: (.+)\.go$
        text: result .* is never used
      - path: (.+)\.go$
        text: 'var-naming: avoid meaningless package names'
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/deckhouse)
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
