version: "2"

run:
  # v2 disables the total-work timeout by default; keep the explicit budget.
  timeout: 10m
  allow-parallel-runners: true
  # golangci-lint refuses to run when the targeted Go language version is a newer
  # minor than the Go release the linter binary itself was built with. Without
  # this pin the target is read from go.mod, so a binary built with an older Go
  # minor than the modules declare fails with "the Go language version (...) used
  # to build golangci-lint is lower than the targeted Go version". Pinning keeps
  # the run independent of how new the installed binary happens to be.
  go: "1.25"

linters:
  default: none
  enable:
    - copyloopvar
    - dogsled
    - errcheck
    - gocritic
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unparam
    - whitespace
    # gosimple and typecheck are intentionally absent: v2 folded gosimple's S1
    # checks into staticcheck (enabled above) and dropped typecheck as a linter
    # because type errors are always reported.

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: (.+)\.go$
        text: ST1005.*
      - path: (.+)\.go$
        text: should not use dot imports
      - path: (.+)\.go$
        text: don't use an underscore in package name
      - path: (.+)\.go$
        text: 'exported: .*'
      # Cosmetic staticcheck "quickfix" suggestions (embedded-field / tagged-switch);
      # not correctness issues, kept consistent with the other suppressed nits above.
      - path: (.+)\.go$
        text: QF1008.*
      - path: (.+)\.go$
        text: QF1003.*
      # Same class of cosmetic "quickfix" suggestion (De Morgan's law on a boolean
      # expression). It only became visible once staticcheck absorbed the quickfix
      # checks, so it is suppressed here rather than rewritten in code.
      - path: (.+)\.go$
        text: QF1001.*
      # Duplicate-import style check. It only became visible once staticcheck
      # absorbed the stylecheck (ST) checks, which were not enabled before;
      # untangling the duplicated imports is separate work, not a tooling change.
      - path: (.+)\.go$
        text: ST1019.*
      # Deprecation notices (controller-runtime Result.Requeue, k8s.io/utils/pointer);
      # migrating them is separate follow-up work, not part of this tooling sync.
      - path: (.+)\.go$
        text: SA1019.*
      # gocritic style preference (if-else vs switch).
      - path: (.+)\.go$
        text: 'ifElseChain: .*'
      # unparam noise: test/helper functions that take a fixed argument, and
      # return values kept for API symmetry.
      - path: (.+)\.go$
        text: .* always receives .*
      - path: (.+)\.go$
        text: result .* is never used
      # revive stylistic preference on the internal/utils package name.
      - path: (.+)\.go$
        text: 'var-naming: avoid meaningless package names'
      # errcheck used to carry its own ignore list as regexps
      # ("fmt:.*,[rR]ead|[wW]rite|[cC]lose,io:Copy"), matched against the name of
      # the called function alone. That form is gone, and its replacement,
      # errcheck's exclude-functions, takes exact signatures and so cannot express
      # patterns -- hence these errcheck-scoped exclusions. They must stay anchored
      # on the backquoted call in the message, because the text around it holds the
      # receiver too: an unanchored pattern would also swallow `reader.Seek` or
      # `writer.Chmod`, which the name-only match always reported.
      # Known and deliberate gap: a call on no receiver is reported as "Error return
      # value is not checked", with no name to match, so an unchecked closeAll() is
      # reported here even though the name-only match hid it. Excluding that
      # message would hide every unchecked plain call, which is far more than was
      # ever excluded, so it is left reported.
      - linters:
          - errcheck
        text: 'Error return value of `fmt\.'
      - linters:
          - errcheck
        text: 'Error return value of `(?:[^`]*\.)?[^`.]*([rR]ead|[wW]rite|[cC]lose)[^`.]*` is not checked'
      - linters:
          - errcheck
        text: 'Error return value of `io\.Copy'
    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gci
    - gofmt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/deckhouse)
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
