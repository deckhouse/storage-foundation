date: "2026-xx-xx"
summary: ""
highlights: []

security:
  - "The Ingress that publishes a DataExport or a DataImport now verifies the certificate of the exporter or importer pod it proxies to. It used to speak HTTPS to the pod but accept any certificate. Each pod signs its serving certificate with its own CA, and the Ingress now trusts only that CA and only the name of the pod's Service."

fixes:
  - "Downloading a file from a DataExport in filesystem mode now gives the browser the right file name when it contains spaces, `;`, quotes or non-ASCII characters. The name in `Content-Disposition` used to be written unescaped, which cut it short or broke the header; it is now quoted or encoded per RFC 6266. Plain names are sent exactly as before."

