date: "2026-xx-xx"
summary: ""
highlights: []

new_features:
  - "On DKP 1.78 and later, a `StorageClass` with the `storage.deckhouse.io/internal: \"true\"` label is never available to projects with `multitenancy-manager` enabled: the `storageclasses` definition excludes it, so it is not listed in `AvailableClusterResource` and a `DataImport` or `VolumeRestoreRequest` naming it is denied even if a `ClusterResourceGrantPolicy` allows the class; a `PersistentVolumeClaim` naming it gets the default class of the project or is denied. The storage modules set the label on the classes of their own components. On earlier DKP versions the definition stays the same as the copy of `multitenancy-manager`, so the label has no effect there. A `multitenancy-manager` version that renders its own copy of `storageclasses` whatever the state of storage-foundation has no such rule, and while it owns the object, the label has no effect either."
  - "A new `volume-health-exporter` DaemonSet runs one Pod on every node and reports, through the textfile collector of the node exporter, the CSI volumes published into Pods whose filesystem the kernel has switched to read-only while the mount itself stays writable, for example after an ext4 error with `errors=remount-ro`: the `storage_foundation_volume_read_only` metric is `1` for such a volume and `0` for a writable one, with the `persistentvolume`, `driver`, `pod_uid`, `fstype` and `node` labels. It works for every CSI driver, with or without the staging step, and does not report block volumes or volumes the CSI driver staged read-only, such as `ReadOnlyMany` claims. A volume a Pod mounts with `readOnly: true` is reported with `0` while its filesystem is writable: a CSI driver makes such a mount read-only by remounting it after the bind, and a remount does not reach the mount namespace of the exporter. The Pod reads only the mount table and the kubelet files of the Pod volumes, needs no access to the Kubernetes API and listens on no port."
  - "The `PersistentVolumeFilesystemIsRO` alert (severity 4) fires when `storage_foundation_volume_read_only` has been `1` for 2 minutes and names the node, the PersistentVolume, the CSI driver and the UID of the Pod, and, while kube-state-metrics reports them, the namespace and the name of the Pod and the PersistentVolumeClaim. The `D8StorageFoundationVolumeHealthExporterStale` alert (severity 8) fires when the metrics file of a node has not been updated for more than 5 minutes or the node exporter does not report the file of a node where the `volume-health-exporter` Pod runs."
  - "`volume-health-exporter` also reports `storage_foundation_volume_filesystem_errors` with the `persistentvolume`, `driver`, `fstype` and `node` labels: the number of errors that the ext2, ext3 or ext4 filesystem of a volume has recorded in its superblock since it was last checked with `e2fsck`, read from `/sys/fs/ext4/<device>/errors_count`. The `PersistentVolumeFilesystemErrors` alert (severity 5) fires when it has been above `0` for 1 minute, also while the filesystem is still writable, as with `errors=continue`, the default of `mke2fs`. A kernel without the file gives no series."
  - "`volume-health-exporter` also reports `storage_foundation_volume_filesystem_shutdown` with the `persistentvolume`, `driver`, `fstype` and `node` labels for the XFS volumes: `1` if the filesystem has shut down, for example after an I/O error on its log, and `0` if it is running. A shut down XFS fails every read and write while the mount still looks writable, so `storage_foundation_volume_read_only` does not show it. The exporter detects it with `stat()` on the root of the volume, which XFS refuses with an I/O error without reading the device; a call that does not return within 2 seconds is not waited for, and only one call per volume is in flight. The `PersistentVolumeFilesystemShutdown` alert (severity 4) fires when the metric has been `1` for 2 minutes."

improvements:
  - "Disabling storage-foundation now requires confirmation: the module declares `disable.confirmation`, and its message lists what stops working (VolumeSnapshot and PVC clones, DataExport and DataImport, VolumeRestoreRequest and the namespace snapshots of state-snapshotter, and the `volumesnapshotclasses` grant for projects)."
  - "Disabling storage-foundation no longer removes the `storageclasses` grant and its `PersistentVolumeClaim` reference `storageclasses-pvc`: both carry `helm.sh/resource-policy: keep`, stay in the cluster and are taken over by `multitenancy-manager`, so `StorageClass` stays restricted in projects. With versions of `multitenancy-manager` that register them only while storage-foundation is disabled, enabling and disabling storage-foundation passes the objects between the two modules without removing them. Disabling storage-foundation still removes the `volumesnapshotclasses` grant and the `DataImport` and `VolumeRestoreRequest` references."
  - "A `VolumeSnapshot` of a `PersistentVolumeClaim` is now refused at creation when no `VolumeSnapshotClass` can serve it, instead of being created and staying unready with an error on its status: the class it names, or the one the `storage.deckhouse.io/volumesnapshotclass` annotation of the `StorageClass` supplies, does not exist or belongs to another CSI driver, or it names none and the CSI driver of the volume has no `VolumeSnapshotClass` at all. The driver is taken from the bound `PersistentVolume`, or from the `StorageClass` provisioner while the claim is not bound; a volume without a CSI source and a `VolumeSnapshot` taken from an existing `VolumeSnapshotContent` are not checked. The webhooks get `get` on `persistentvolumes` for this."

fixes:
  - "In a project limited by a `ClusterResourceGrantPolicy`, a DataImport in `CreatePVC` mode whose PersistentVolumeClaim is rejected by the grant check reports it in the `Ready` condition with the `TargetFailed` reason and the message of the refusal instead of retrying silently. A claim that got the default class of the project instead of the one in `pvcTemplate` keeps that class."
  - "A VolumeRestoreRequest whose PersistentVolumeClaim is rejected by the grant check reports it with a `VRRPVCCreateFailed` event, and one whose claim got another class with a `VRRStorageClassReplaced` event."
  - "On DKP 1.78 and later, with `multitenancy-manager` enabled, a `PersistentVolumeClaim` that restores a `VolumeSnapshot` or clones another `PersistentVolumeClaim` keeps the class it names instead of getting the default class of the project, which a volume of another CSI driver could not be provisioned in: if the class is not available to the project, the claim is rejected with a message that asks for an available class served by the CSI driver of the source. On earlier DKP versions these claims are handled as before."
  - "On DKP 1.78 and later, with `multitenancy-manager` enabled, a `PersistentVolumeClaim` that names a class in the `volume.beta.kubernetes.io/storage-class` annotation is checked by that class: Kubernetes provisions the volume in the class of the annotation and ignores `spec.storageClassName`, so a project user could get a volume in a class the project may not use. If the class is not available to the project, the claim is rejected. On earlier DKP versions the annotation is not checked."
  - "On DKP 1.78 and later, with `multitenancy-manager` enabled, the class is checked in the volume claim templates of a `StatefulSet` and in the ephemeral volumes of a `Pod`, `Deployment`, `ReplicaSet`, `DaemonSet`, `StatefulSet`, `Job`, `CronJob` and `ReplicationController`, by the `volume.beta.kubernetes.io/storage-class` annotation of the template if it is set and by `spec.storageClassName` otherwise: kube-controller-manager creates the `PersistentVolumeClaim` objects of these templates on behalf of a `kube-system` ServiceAccount that the grant check skips, so a project user could get a volume in a class the project may not use. An object with a template whose class is not available to the project is rejected. On DKP 1.79 and later, an object with a template that names no class is rejected if the default class of the cluster, which its volume would get, is not available to the project; an empty `storageClassName` is allowed."
  - "The `data-source-validator` component runs as a Deployment instead of a StatefulSet, so a module update replaces its Pod even when the old one is stuck, for example in `ImagePullBackOff`; the old StatefulSet is removed on update. Its PodDisruptionBudget no longer blocks draining the node in HA mode."
  - "`DataExport` and `DataImport` published with `--publish` no longer stay `PublishFailed` when the `publicDomainTemplate` of the cluster has the placeholder not followed by a dot, for example `%s-example.com`: the host of the publishing Ingress, its TLS certificate lookup and the CORS origin are built by substituting the `api` and `console` subdomains for `%s` in the template, instead of cutting a `%s.` prefix and appending the subdomain with a dot. Templates such as `%s.example.com` and `kube-%s.example.com` give the same hosts as before and as the rest of Deckhouse."
  - "On DKP 1.79 and later, the `storageclasses` grant also finds the default `StorageClass` of the cluster by the older `storageclass.beta.kubernetes.io/is-default-class` annotation, which Kubernetes still reads, so the grant and Kubernetes agree on the default class."
  - "The `Editor` and `Admin` access levels of the current role model can now create, change and delete `VolumeSnapshot` objects: the module adds the `d8:user-authz:storage-foundation:editor` role. Before, writing a `VolumeSnapshot` took `ClusterEditor`, although `Editor` can create a `PersistentVolumeClaim`, and none of the levels an `AuthorizationRule` in a namespace can set, which end at `Admin`, included it. `VolumeSnapshotClass` stays writable from `ClusterEditor` up."
  - "The `Editor` and `Admin` access levels of the current role model can now create, change and delete `DataExport` and `DataImport` objects and transfer volume data through them (the `dataexports/download` and `dataimports/download` subresources the data transfer server checks). Before, writing them took `ClusterEditor`, and no access level up to `ClusterAdmin` could call the transfer itself. The `ClusterEditor` role of the module no longer grants anything in the `storage-foundation.deckhouse.io` group: `DataExport` and `DataImport` come from `Editor`, and `VolumeCaptureRequest` and `VolumeRestoreRequest` are not writable by any access level."
  - "In RBACv2, the namespace `manager` level can now transfer volume data through `DataExport` and `DataImport`, as the `Editor` access level of the current role model can: on DKP 1.78 and later the `d8:namespace-capability:storage-foundation:transfer_volume_data` capability aggregates into the namespace `manager` role instead of `admin` (which includes it), and on earlier versions `d8:use:capability:module:storage-foundation:transfer_volume_data` aggregates into the `manager` use role. Before, a namespace manager could create these objects but not transfer data through them."
  - "With `multitenancy-manager` enabled, the module renders a field of its grant definitions and references (`catalogFields`, `fieldPaths[].message`, `fieldPaths[].resources`, `fieldPaths[].missingPath` and `defaultFrom.additionalAnnotationKeys`) only if the CRD of `multitenancy-manager` in the cluster declares it, instead of deciding by the DKP version. A Deckhouse build from a branch reports the version `dev`, which the module took for the newest one, so on a cluster running such a build from a release branch below 1.78 the module install failed with `.spec.catalogFields: field not declared in schema` and stopped the Deckhouse queue. The references that need `fieldPaths[].resources`, for the ephemeral volumes of a `Pod`, `Job` and `CronJob`, are not created while the CRD does not declare it. On DKP releases the module creates the same objects as before."

upgrade_notes:
  - "On DKP 1.79 and later, `multitenancy-manager` picks the class of a `PersistentVolumeClaim` without `spec.storageClassName` differently. In a project whose `ClusterResourceGrantPolicy` sets a `default` different from the default class of the cluster, such a claim, including the one a `DataImport` creates, now gets the default class of the project even if the project may use the default class of the cluster; before, it kept the default class of the cluster. A claim with `storageClassName: \"\"` keeps the empty class instead of getting the default class of the project. Of several default classes of the cluster, the newest is used, as in Kubernetes."

security:
  - "A `VolumeRestoreRequest` can no longer be used to get a copy of a volume of another namespace. Its source, a `VolumeSnapshotContent` or a `PersistentVolume`, was taken by name only, so whoever could create the request (a namespace manager in the RBACv2 model, or a `ClusterEditor` limited to some namespaces) could restore any volume of the cluster into a namespace of their own. The source must now belong to the namespace of the request: a `VolumeSnapshotContent` bound to a `VolumeSnapshot` of that namespace, a `PersistentVolume` claimed from it, or an artifact created by a `VolumeCaptureRequest` of that namespace or taken over by a `SnapshotContent` of that namespace. Otherwise the request turns `Ready=False` with the `ForeignSource` reason, gets a `Warning` event with the same reason, and no volume is created. A request the module creates in its own namespace to export a snapshot is checked against the namespace of its `DataExport`, a request the backup module creates in `d8-backup` against the namespace its `storage-foundation.deckhouse.io/storage-manager-namespace` annotation names (no other namespace is trusted with this annotation), and a `DataExport` no longer exports a `SnapshotContent` that records no namespace. The CSI provisioner restores no source until the controller has verified it for the current generation of the request (the `SourceVerified` condition), whatever namespace the source names, and reads the request again right before it creates the volume, so a request refused in the meantime gets no volume. A `DataExport` of a snapshot takes the restored volume only after this verification, and if the source is refused, the `DataExport` fails with the `TargetNotFound` reason and the refusal in the message instead of waiting. Writing `VolumeSnapshotContent` objects, the other way to reach a volume of another namespace, is closed separately: see the item about `ClusterEditor` and `VolumeSnapshotContent` below."
  - "`VolumeCaptureRequest` and `VolumeRestoreRequest` are internal resources and users can no longer create, change or delete them: they are removed from the `ClusterEditor` access level and from the RBACv2 `edit` capability of a namespace. The `User` access level and the namespace `view` capability still read them."
  - "A `VolumeCaptureRequest` captures or detaches a volume only if its `PersistentVolume` is bound to the claim in `spec.target`. Before, a claim that named the `PersistentVolume` of another namespace in `spec.volumeName` (such a claim stays `Pending`) was enough to snapshot or detach that volume, and in `Detach` mode the `storage-foundation.deckhouse.io/detach-pv-name` annotation of the request could name any `PersistentVolume` of the cluster once the claim was gone. A request with such a source now turns `Ready=False` with the `InvalidSource` reason and changes nothing."
  - "A `PersistentVolume` detached by a `VolumeCaptureRequest` in `Detach` mode stays reserved for a claim in the namespace of the request that never exists: its `claimRef` names that namespace and the `ret-pv-<request uid>` claim instead of being removed. Before, the volume became `Available` and any claim of the cluster could bind it, either by naming it in `spec.volumeName` or by matching its class and size."
  - "The `User`, `PrivilegedUser`, `Editor` and `Admin` access levels of the current role model no longer read the cluster-scoped `VolumeSnapshotContent` objects, which name the `VolumeSnapshot` objects of all namespaces and hold the storage handles of their snapshots: the `User` role of the module granted them, as the one of snapshot-controller did before v0.1.20. `ClusterEditor` and above keep reading them."
  - "The `ClusterEditor` access level of the current role model can no longer create, change or delete `VolumeSnapshotContent` objects. A `VolumeSnapshotContent` holds the storage handle of a snapshot and decides which `VolumeSnapshot` it is bound to, so with it a `ClusterEditor` limited to some namespaces could bind a snapshot of a volume from any namespace to a `VolumeSnapshot` of its own and restore it. Writing them now takes `ClusterAdmin` (the new `d8:user-authz:storage-foundation:cluster-admin` role), as Deckhouse leaves `ClusterEditor` only reading `PersistentVolume` objects. The new role model is unchanged: the storage `manager` writes `VolumeSnapshotContent` as it writes `PersistentVolume`."

breaking:
  - "Creating, changing or deleting `VolumeCaptureRequest` and `VolumeRestoreRequest` objects is no longer granted by the `ClusterEditor` access level or by the namespace `edit` capability of RBACv2 (the namespace `manager`), so scripts, pipelines or operators that created them under these levels get `Forbidden`. Export and import volume data with `DataExport` and `DataImport`, take and restore snapshots with `VolumeSnapshot` or the `Snapshot` of state-snapshotter, or bind a role of your own with these verbs to the account that has to create them."
  - "Reading `VolumeSnapshotContent` objects now needs `ClusterEditor` in the current role model, and creating, changing or deleting them by hand, for example to import an existing storage snapshot as a pre-provisioned `VolumeSnapshotContent` or to change its `deletionPolicy`, needs `ClusterAdmin` or `SuperAdmin`; in the new role model both stay with the storage `viewer` and `manager`. Snapshots taken, restored and deleted through `VolumeSnapshot` objects are not affected."

docs:
  - "The usage page lists the volume claim templates whose class is checked and describes when a template without a class is rejected."
  - "The usage page describes which grants stay when storage-foundation is disabled and how the `storageclasses` grant passes between storage-foundation and `multitenancy-manager`."
  - "The usage page shows how to select the classes of a storage module in a `ClusterResourceGrantPolicy` by the `storage.deckhouse.io/managed-by` label and describes the `storage.deckhouse.io/internal` label."
  - "The usage page describes the namespace `d8 data` uses without `-n`: in `d8` v0.34.8 and later it is the namespace of the current kubeconfig context, as in kubectl, instead of `d8-storage-volume-data-manager`."
  - "The usage page describes which class a `PersistentVolumeClaim` without `spec.storageClassName` gets in a project, how the default class of the cluster is chosen, and that a claim left without a class gets the default class of the cluster later without the check."
  - "The usage page describes the `storage_foundation_volume_read_only` metric, the `PersistentVolumeFilesystemIsRO` and `D8StorageFoundationVolumeHealthExporterStale` alerts, and what to do when the filesystem of a volume is read-only."
  - "The usage page describes the `storage_foundation_volume_filesystem_errors` metric and the `PersistentVolumeFilesystemErrors` alert."
  - "The usage page describes the `storage_foundation_volume_filesystem_shutdown` metric and the `PersistentVolumeFilesystemShutdown` alert."





