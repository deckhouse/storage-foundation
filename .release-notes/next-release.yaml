date: "2026-xx-xx"
summary: ""
highlights: []

new_features:
  - "`DataExport` and `DataImport` now record a Kubernetes Event when their `Ready` condition changes status or reason, so `kubectl describe` shows how the object got where it is: for example `Pending`, then `ServerReady`, then `Expired` or `Completed`. The reason of the Event is the reason of the condition. A failure, such as `TargetNotFound`, `DeploymentFailed` or `CleanupFailed`, is recorded as `Warning`; a step of progress and a normal ending, such as `Pending`, `TargetNotReady`, `Expired` or `Completed`, is recorded as `Normal`, even though `Ready` is `False` then. A reconcile pass that changes neither the status nor the reason records no Event. The Events are in the namespace of the object."

fixes:
  - "The `DataImport` server answered `201 Created` to the last part of a file upload even when it then failed to move the completed file into place, and appended an error message to that successful response. It now answers `500` in that case, and the uploaded data is kept in the temporary file of the upload."
  - "When the `DataImport` server received a part of a file upload that did not complete the file, it applied the owner, permissions and modification time from the request to the file of the same name already in the volume, if there was one, and otherwise logged an error and appended it to the `204` response. The attributes are now applied only when the upload completes, before the file is moved into place, and a failure to apply them is answered with `500` instead of `201 Created`."
  - "When a part of a block device upload to `DataImport` went past the size declared in `X-Content-Length`, the server wrote the excess bytes to the device and only then answered `422`, overwriting the data that followed the image. A request with a known body length is now refused before anything is written, and a body of unknown length is written only up to the declared size."
  - "When a file uploaded to `DataImport` already existed in the volume with a different size, the server added the size of the old file to the upload offset. The last part then did not complete the upload: the response reported a wrong `X-Next-Offset`, and the data stayed in the temporary file. The offset now counts only the data of the new upload."
  - "Downloading a file from a DataExport in filesystem mode now gives the browser the right file name when it contains spaces, `;`, quotes or non-ASCII characters. The name in `Content-Disposition` used to be written unescaped, which cut it short or broke the header; it is now quoted or encoded per RFC 6266. Plain names are sent exactly as before."
  - "A DataExport of a PVC stayed at `Ready=False` with reason `ValidationFailed` for as long as any pod in the namespace named the PVC in its volumes, even a pod that had already run to completion (phase `Succeeded` or `Failed`), such as the pod of a finished Job. Such pods no longer hold the export back; a pod that has not finished, including one that is being deleted, still does."
  - "A DataExport of a PVC did not wait for the volume to be detached from its node before taking it over. `VolumeAttachment` objects are cluster-scoped, and the check looked for them only in the namespace of the PVC, so it never found one. The export now waits until no `VolumeAttachment` reports the volume as attached."
  - "The VolumeSnapshot webhook again refuses a snapshot whose `volumeSnapshotClassName` differs from the class named by the `storage.deckhouse.io/volumesnapshotclass` annotation of the volume's StorageClass, when that StorageClass was created by a storage module. The webhook looked for a label that no module sets, so such a snapshot was accepted and taken with the class it named. Module StorageClasses are now recognised by their `storage.deckhouse.io/managed-by` label. A StorageClass without the annotation does not cause a refusal."

security:
  - "The Ingress that publishes a DataExport or a DataImport now verifies the certificate of the exporter or importer pod it proxies to. It used to speak HTTPS to the pod but accept any certificate. Each pod signs its serving certificate with its own CA, and the Ingress now trusts only that CA and only the name of the pod's Service."

improvements:
  - "The `DataExport` and `DataImport` server pods now log at the level set by the module's `logLevel` parameter, in the same JSON format as the other module components. They used to log at `INFO` in plain text whatever the setting was, so their `DEBUG` messages could not be turned on. A pod takes the level when it is created. The messages the controller writes about `DataExport` objects now follow `logLevel` as well, and the routine ones among them appear only from `DEBUG` on."

