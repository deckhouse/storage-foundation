# Заготовка для следующего релиза. Перед тегом переименовать в vX.Y.Z.ru.yaml
# (имя файла должно совпадать с тегом) и заполнить.
date: "2026-xx-xx"
summary: ""
highlights: []

new_features:
  - "В DKP 1.78 и новее при включённом `multitenancy-manager` `StorageClass` с меткой `storage.deckhouse.io/internal: \"true\"` никогда не доступен проектам: определение `storageclasses` исключает его, поэтому его нет в `AvailableClusterResource`, а `DataImport` или `VolumeRestoreRequest` с этим классом отклоняется, даже если `ClusterResourceGrantPolicy` класс разрешает; `PersistentVolumeClaim` с этим классом получает класс проекта по умолчанию или отклоняется. Модули хранения ставят эту метку на классы своих компонентов. В более ранних версиях DKP определение совпадает с копией `multitenancy-manager`, и метка не действует. В версии `multitenancy-manager`, которая рендерит свою копию `storageclasses` независимо от состояния storage-foundation, такого правила нет, и, пока объектом владеет она, метка тоже не действует."

improvements:
  - "Отключение storage-foundation теперь требует подтверждения: модуль объявляет `disable.confirmation`, а сообщение перечисляет, что перестанет работать (`VolumeSnapshot` и клоны PVC, `DataExport` и `DataImport`, `VolumeRestoreRequest` и снимки пространств имён state-snapshotter, грант `volumesnapshotclasses` для проектов)."
  - "Отключение storage-foundation больше не удаляет грант `storageclasses` и его ссылку из `PersistentVolumeClaim` `storageclasses-pvc`: у обоих аннотация `helm.sh/resource-policy: keep`, они остаются в кластере, и их забирает себе `multitenancy-manager`, поэтому `StorageClass` в проектах по-прежнему ограничен. С версиями `multitenancy-manager`, которые регистрируют их, только пока storage-foundation выключен, при включении и отключении storage-foundation объекты переходят от одного модуля к другому и не удаляются. Грант `volumesnapshotclasses` и ссылки из `DataImport` и `VolumeRestoreRequest` отключение storage-foundation по-прежнему удаляет."
  - "`VolumeSnapshot` для `PersistentVolumeClaim` теперь отклоняется при создании, если ни один `VolumeSnapshotClass` не может его обслужить, а не создаётся и остаётся неготовым с ошибкой в статусе: указанный класс (или подставленный из аннотации `storage.deckhouse.io/volumesnapshotclass` у `StorageClass`) не существует или принадлежит другому CSI-драйверу, либо класс не указан, а у CSI-драйвера тома нет ни одного `VolumeSnapshotClass`. Драйвер берётся из привязанного `PersistentVolume`, а пока claim не привязан, из provisioner у `StorageClass`; том без CSI-источника и `VolumeSnapshot` из существующего `VolumeSnapshotContent` не проверяются. Для этого вебхукам выдано право `get` на `persistentvolumes`."

fixes:
  - "В проекте, ограниченном `ClusterResourceGrantPolicy`, DataImport в режиме `CreatePVC`, чей PersistentVolumeClaim отклонила проверка грантов, сообщает об этом в условии `Ready` с причиной `TargetFailed` и текстом отказа, а не повторяет попытку молча. PVC, который получил класс проекта по умолчанию вместо указанного в `pvcTemplate`, сохраняет этот класс."
  - "VolumeRestoreRequest, чей PersistentVolumeClaim отклонила проверка грантов, сообщает об этом событием `VRRPVCCreateFailed`, а если PVC получил другой класс — событием `VRRStorageClassReplaced`."
  - "В DKP 1.78 и новее при включённом `multitenancy-manager` `PersistentVolumeClaim`, который восстанавливает `VolumeSnapshot` или клонирует другой `PersistentVolumeClaim`, сохраняет указанный класс и не получает класс проекта по умолчанию, в котором том другого CSI-драйвера создать нельзя: если класс недоступен проекту, claim (заявка на том) отклоняется с сообщением, что нужно указать доступный проекту класс, который обслуживает CSI-драйвер источника. В более ранних версиях DKP такие claim обрабатываются как раньше."
  - "В DKP 1.78 и новее при включённом `multitenancy-manager` `PersistentVolumeClaim`, в котором класс указан в аннотации `volume.beta.kubernetes.io/storage-class`, проверяется по этому классу: Kubernetes создаёт том в классе из аннотации и не смотрит на `spec.storageClassName`, поэтому пользователь проекта мог получить том в классе, недоступном проекту. Если класс недоступен проекту, claim (заявка на том) отклоняется. В более ранних версиях DKP аннотация не проверяется."
  - "В DKP 1.78 и новее при включённом `multitenancy-manager` класс проверяется в шаблонах томов `StatefulSet` и в эфемерных томах `Pod`, `Deployment`, `ReplicaSet`, `DaemonSet`, `StatefulSet`, `Job`, `CronJob` и `ReplicationController` — по аннотации `volume.beta.kubernetes.io/storage-class` шаблона, если она задана, иначе по `spec.storageClassName`: `PersistentVolumeClaim` из этих шаблонов создаёт kube-controller-manager от имени ServiceAccount из `kube-system`, которую проверка грантов пропускает, поэтому пользователь проекта мог получить том в классе, недоступном проекту. Объект с шаблоном, класс которого недоступен проекту, отклоняется. В DKP 1.79 и новее объект с шаблоном без класса отклоняется, если класс кластера по умолчанию, который получил бы его том, недоступен проекту; пустой `storageClassName` допускается."
  - "Компонент `data-source-validator` работает как Deployment вместо StatefulSet, поэтому обновление модуля заменяет его под, даже если старый завис, например в `ImagePullBackOff`; старый StatefulSet при обновлении удаляется. Его PodDisruptionBudget больше не блокирует drain (освобождение) узла в режиме HA."
  - "`DataExport` и `DataImport`, опубликованные с `--publish`, больше не остаются в `PublishFailed`, если в `publicDomainTemplate` кластера после `%s` нет точки, например `%s-example.com`: хост публикующего Ingress, поиск его TLS-сертификата и CORS-origin строятся подстановкой поддоменов `api` и `console` вместо `%s` в шаблоне, а не отрезанием префикса `%s.` и дописыванием поддомена через точку. Шаблоны вроде `%s.example.com` и `kube-%s.example.com` дают те же хосты, что и раньше и что в остальном Deckhouse."
  - "В DKP 1.79 и новее грант `storageclasses` находит класс кластера по умолчанию и по устаревшей аннотации `storageclass.beta.kubernetes.io/is-default-class`, которую Kubernetes по-прежнему учитывает, поэтому грант и Kubernetes считают классом по умолчанию один и тот же `StorageClass`."
  - "Уровни доступа `Editor` и `Admin` текущей ролевой модели теперь могут создавать, изменять и удалять `VolumeSnapshot`: модуль добавляет роль `d8:user-authz:storage-foundation:editor`. Раньше для записи `VolumeSnapshot` требовался `ClusterEditor`, хотя `Editor` может создавать `PersistentVolumeClaim`, а ни один из уровней, которые можно задать в `AuthorizationRule` пространства имён (они заканчиваются на `Admin`), его не включал. `VolumeSnapshotClass` по-прежнему доступен на запись начиная с `ClusterEditor`."
  - "Уровни доступа `Editor` и `Admin` текущей ролевой модели теперь могут создавать, изменять и удалять `DataExport` и `DataImport` и переносить через них данные тома (подресурсы `dataexports/download` и `dataimports/download`, которые проверяет сервер переноса). Раньше запись в них требовала `ClusterEditor`, а сам перенос не был доступен ни одному уровню вплоть до `ClusterAdmin`. Роль модуля для `ClusterEditor` больше ничего не выдаёт в группе `storage-foundation.deckhouse.io`: `DataExport` и `DataImport` приходят от `Editor`, а `VolumeCaptureRequest` и `VolumeRestoreRequest` не доступны на запись ни одному уровню."
  - "В RBACv2 уровень `manager` пространства имён теперь может переносить данные тома через `DataExport` и `DataImport`, как и уровень доступа `Editor` текущей ролевой модели: в DKP 1.78 и новее возможность `d8:namespace-capability:storage-foundation:transfer_volume_data` агрегируется в роль `manager` пространства имён вместо `admin` (который её включает), а в более ранних версиях `d8:use:capability:module:storage-foundation:transfer_volume_data` агрегируется в use-роль `manager`. Раньше менеджер пространства имён мог создавать эти объекты, но не переносить через них данные."

upgrade_notes:
  - "В DKP 1.79 и новее `multitenancy-manager` иначе выбирает класс `PersistentVolumeClaim` без `spec.storageClassName`. В проекте, у которого `ClusterResourceGrantPolicy` задаёт `default`, отличный от класса кластера по умолчанию, такой PVC, в том числе созданный `DataImport`, теперь получает класс проекта по умолчанию, даже если проекту доступен класс кластера по умолчанию; раньше оставался класс кластера по умолчанию. PVC с `storageClassName: \"\"` остаётся без класса и не получает класс проекта по умолчанию. Из нескольких классов кластера по умолчанию используется самый новый, как в Kubernetes."

security:
  - "Через `VolumeRestoreRequest` больше нельзя получить копию тома чужого пространства имён. Источник, `VolumeSnapshotContent` или `PersistentVolume`, брался только по имени, поэтому тот, кто может создать заявку (менеджер пространства имён в модели RBACv2 или `ClusterEditor`, ограниченный частью пространств имён), мог восстановить любой том кластера в своё пространство имён. Теперь источник должен принадлежать пространству имён заявки: `VolumeSnapshotContent`, привязанный к `VolumeSnapshot` этого пространства имён, `PersistentVolume`, занятый заявкой из него, или артефакт, который создал `VolumeCaptureRequest` этого пространства имён или забрал себе `SnapshotContent` этого пространства имён. Иначе заявка переходит в `Ready=False` с причиной `ForeignSource`, получает событие `Warning` с той же причиной, и том не создаётся. Заявка, которую модуль создаёт в своём пространстве имён для экспорта снимка, сверяется с пространством имён своего `DataExport`, заявка модуля backup в `d8-backup` — с пространством имён из её аннотации `storage-foundation.deckhouse.io/storage-manager-namespace` (другим пространствам имён эта аннотация не доверяется), а `DataExport` больше не экспортирует `SnapshotContent`, в котором не записано пространство имён. CSI-провижнер не восстанавливает никакой источник, пока контроллер не проверит его для текущего поколения заявки (условие `SourceVerified`), какое бы пространство имён ни было указано у источника, и перед созданием тома ещё раз читает заявку, поэтому заявка, отклонённая за это время, тома не получает. `DataExport` снимка забирает восстановленный том только после этой проверки, а если источник отклонён, `DataExport` завершается ошибкой с причиной `TargetNotFound` и текстом отказа в сообщении, а не ждёт. Запись `VolumeSnapshotContent`, другой путь к тому чужого пространства имён, закрыта отдельно: см. пункт ниже про `ClusterEditor` и `VolumeSnapshotContent`."
  - "`VolumeCaptureRequest` и `VolumeRestoreRequest` — внутренние ресурсы, и пользователи больше не могут их создавать, изменять и удалять: они убраны из уровня доступа `ClusterEditor` и из RBACv2-возможности `edit` пространства имён. Уровень `User` и возможность `view` пространства имён по-прежнему их читают."
  - "`VolumeCaptureRequest` снимает или отсоединяет том, только если его `PersistentVolume` привязан к заявке из `spec.target`. Раньше для снимка или отсоединения тома другого пространства имён хватало заявки, в `spec.volumeName` которой указан его `PersistentVolume` (такая заявка остаётся в `Pending`), а в режиме `Detach` аннотация запроса `storage-foundation.deckhouse.io/detach-pv-name` после удаления заявки могла указать любой `PersistentVolume` кластера. Теперь запрос с таким источником переходит в `Ready=False` с причиной `InvalidSource` и ничего не меняет."
  - "`PersistentVolume`, отсоединённый `VolumeCaptureRequest` в режиме `Detach`, остаётся зарезервированным за несуществующей заявкой в пространстве имён запроса: его `claimRef` не удаляется, а указывает на это пространство имён и заявку `ret-pv-<uid запроса>`. Раньше том становился `Available`, и его могла занять любая заявка кластера, указав его в `spec.volumeName` или подойдя по классу и размеру."
  - "Уровни доступа `User`, `PrivilegedUser`, `Editor` и `Admin` текущей ролевой модели больше не читают кластерные `VolumeSnapshotContent`, в которых указаны `VolumeSnapshot` всех пространств имён и идентификаторы их снимков в хранилище: их выдавала роль модуля для `User`, как и роль snapshot-controller до v0.1.20. `ClusterEditor` и выше по-прежнему читают их."
  - "Уровень доступа `ClusterEditor` текущей ролевой модели больше не может создавать, изменять и удалять `VolumeSnapshotContent`. `VolumeSnapshotContent` хранит идентификатор снимка в хранилище и определяет, к какому `VolumeSnapshot` он привязан, поэтому `ClusterEditor`, ограниченный частью пространств имён, мог привязать снимок тома из любого пространства имён к своему `VolumeSnapshot` и восстановить его. Теперь для записи нужен `ClusterAdmin` (новая роль `d8:user-authz:storage-foundation:cluster-admin`) — так же Deckhouse оставляет `ClusterEditor` только чтение `PersistentVolume`. Новая ролевая модель не меняется: `manager` подсистемы хранения пишет `VolumeSnapshotContent` так же, как `PersistentVolume`."

breaking:
  - "Создание, изменение и удаление `VolumeCaptureRequest` и `VolumeRestoreRequest` больше не выдаются уровнем доступа `ClusterEditor` и RBACv2-возможностью `edit` пространства имён (`manager` пространства имён), поэтому скрипты, конвейеры и операторы, которые создавали их с этими уровнями, получат `Forbidden`. Для переноса данных томов используйте `DataExport` и `DataImport`, для снимков и восстановления — `VolumeSnapshot` или `Snapshot` модуля state-snapshotter; если объекты всё же нужно создавать напрямую, привяжите к нужной учётной записи собственную роль с этими глаголами."
  - "Чтение `VolumeSnapshotContent` в текущей ролевой модели теперь требует `ClusterEditor`, а создание, изменение и удаление вручную — например, импорт существующего снимка хранилища как заранее созданного (pre-provisioned) `VolumeSnapshotContent` или смена его `deletionPolicy` — требует `ClusterAdmin` или `SuperAdmin`; в новой ролевой модели и то и другое остаётся у `viewer` и `manager` подсистемы хранения. Снимки, которые создаются, восстанавливаются и удаляются через `VolumeSnapshot`, это не затрагивает."

docs:
  - "На странице использования перечислены шаблоны томов, класс которых проверяется, и описано, когда отклоняется шаблон без класса."
  - "На странице использования описано, какие гранты остаются после отключения storage-foundation и как грант `storageclasses` переходит между storage-foundation и `multitenancy-manager`."
  - "На странице использования показано, как выбрать классы модуля хранения в `ClusterResourceGrantPolicy` по метке `storage.deckhouse.io/managed-by`, и описана метка `storage.deckhouse.io/internal`."
  - "На странице использования описано, какой неймспейс `d8 data` использует без `-n`: в `d8` начиная с v0.34.8 это неймспейс текущего контекста kubeconfig, как у kubectl, а не `d8-storage-volume-data-manager`."
  - "На странице использования описано, какой класс получает `PersistentVolumeClaim` без `spec.storageClassName` в проекте, как выбирается класс кластера по умолчанию и что PVC, оставшийся без класса, позже получает класс кластера по умолчанию без проверки."





