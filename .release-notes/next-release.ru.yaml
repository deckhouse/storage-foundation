# Заготовка для следующего релиза. Перед тегом переименовать в vX.Y.Z.ru.yaml
# (имя файла должно совпадать с тегом) и заполнить.
date: "2026-xx-xx"
summary: ""
highlights: []

fixes:
  - "Сервер `DataImport` отвечал `201 Created` на последнюю часть загружаемого файла, даже если затем не мог переместить готовый файл на его место, и дописывал сообщение об ошибке к этому успешному ответу. Теперь в этом случае он отвечает `500`, а загруженные данные остаются во временном файле загрузки."
  - "Получив часть загружаемого файла, которая не завершала загрузку, сервер `DataImport` применял владельца, права и время изменения из запроса к уже существующему в томе файлу с тем же именем, а если такого файла не было, записывал ошибку в журнал и дописывал её текст к ответу `204`. Теперь атрибуты применяются только при завершении загрузки, до перемещения файла на его место, а если применить их не удалось, сервер отвечает `500` вместо `201 Created`."
  - "Если часть образа, загружаемого в `DataImport` в блочном режиме, выходила за размер, указанный в `X-Content-Length`, сервер записывал лишние байты на устройство и только потом отвечал `422`, затирая данные, которые шли за образом. Теперь запрос с известной длиной тела отклоняется до записи, а тело неизвестной длины записывается только до заявленного размера."
  - "Если загружаемый в `DataImport` файл уже был в томе с другим размером, сервер прибавлял размер старого файла к смещению загрузки. Из-за этого последняя часть не завершала загрузку: в ответе было неверное значение `X-Next-Offset`, а данные оставались во временном файле. Теперь смещение учитывает только данные новой загрузки."
  - "При скачивании файла из DataExport в файловом режиме браузер теперь получает правильное имя файла, даже если в нём есть пробелы, `;`, кавычки или символы вне ASCII. Раньше имя записывалось в `Content-Disposition` без экранирования, из-за чего оно обрезалось или заголовок становился некорректным. Теперь имя заключается в кавычки или кодируется по RFC 6266. Простые имена передаются так же, как раньше."
  - "DataExport для PVC оставался в состоянии `Ready=False` с причиной `ValidationFailed`, пока в пространстве имён был хотя бы один под, в томах которого указан этот PVC, даже если под уже завершил работу (фаза `Succeeded` или `Failed`), как, например, под выполненного Job. Теперь такие поды не мешают экспорту; под, который ещё не завершился, в том числе удаляемый, по-прежнему его задерживает."
  - "DataExport для PVC не дожидался отключения тома от узла, прежде чем забрать том себе. Объекты `VolumeAttachment` не принадлежат пространству имён, а проверка искала их только в пространстве имён PVC и поэтому не находила ни одного. Теперь экспорт ждёт, пока ни один `VolumeAttachment` не сообщает, что том подключён."

security:
  - "Ingress, публикующий DataExport или DataImport, теперь проверяет сертификат пода экспорта или импорта, к которому проксирует запросы. Раньше он обращался к поду по HTTPS, но принимал любой сертификат. Каждый под подписывает свой серверный сертификат собственным CA, и теперь Ingress доверяет только этому CA и только имени сервиса пода."

