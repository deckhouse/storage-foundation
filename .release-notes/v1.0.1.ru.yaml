date: "2026-11-02"

summary: "Серверы переноса данных больше не обращаются к файлам за пределами тома, том, восстановленный через `VolumeRestoreRequest`, монтируется и достаётся только своему целевому PVC, а на DKP 1.78 модуль создаёт роли в модели RBACv2."

highlights:
  - "Серверы `DataExport` и `DataImport` больше не читают и не записывают файлы за пределами экспортируемого или импортируемого тома. Путь запроса с закодированным `..` позволял прочитать любой файл контейнера сервера, включая его ключ TLS и токен сервисного аккаунта, или создать файл вне тома."
  - "PersistentVolume, восстановленный через `VolumeRestoreRequest`, теперь содержит ссылки на секреты своего StorageClass и заранее привязан к целевому PVC. Поэтому его можно смонтировать на драйверах, которым нужен секрет для подготовки тома на узле, например ceph-csi, и его больше не может забрать другой PVC, ожидающий тома."
  - "На DKP 1.78 и новее модуль создаёт роли в модели RBACv2."

new_features:
  - "На DKP 1.78 и новее модуль создаёт роли в модели RBACv2: ClusterRole `d8:system-capability:storage-foundation:view` и `:edit`, а также `d8:namespace-capability:storage-foundation:view`, `:edit` и `:transfer_volume_data`. Роль `transfer_volume_data` разрешает скачивать и загружать данные тома через `DataExport` и `DataImport`. Она входит в роль администратора namespace и в роль `d8:state-snapshotter:backup-agent` модуля state-snapshotter. На DKP ниже 1.78 прежние роли создаются без изменений."

improvements:
  - "Модуль теперь обрабатывает до четырёх объектов `DataExport` одновременно. Раньше экспорты обрабатывались по одному, и экспорт, созданный, пока запускался другой, ждал его несколько минут, а в его статусе не было ничего, что объясняло бы задержку."
  - "`DataImport` больше не использует отдельный компонент заполнения томов (populator), и `Deployment` этого компонента удалён из модуля. В обоих режимах загружаемые данные сначала попадают во временный PVC в namespace `d8-storage-foundation`. В режиме `mode: CreatePVC` модуль сразу создаёт целевой PVC в namespace пользователя, а после окончания загрузки передаёт ему заполненный том. Модуль больше не создаёт в namespace пользователя вспомогательный Job, который был нужен, чтобы запустить привязку тома для StorageClass с режимом `WaitForFirstConsumer`."
  - "Prometheus теперь собирает метрики контроллера и контроллера управления данными через объекты `PodMonitor`. Метрики отдаются через `kube-rbac-proxy`."

fixes:
  - "PersistentVolume, восстановленный через `VolumeRestoreRequest`, создавался без ссылок на секреты своего StorageClass. Поэтому на драйверах, которым нужен секрет для подготовки тома на узле, например ceph-csi, PVC привязывался, но ни один Pod не мог его смонтировать. Теперь восстановленный PersistentVolume содержит те же ссылки на секреты, что и созданный обычным способом. PersistentVolume, восстановленный раньше, исправить на месте нельзя, потому что поле `spec.csi` неизменяемое. Для такого тома у `VolumeRestoreRequest` появляется предупреждающее событие `VRRPVMissingSecretRefs`, в котором названо недостающее поле."
  - "PersistentVolume, восстановленный через `VolumeRestoreRequest`, оставался в состоянии `Available`, пока не создавался его целевой PVC, и его мог забрать другой PVC того же StorageClass, ожидающий тома. Тогда этот PVC монтировал данные, восстановленные для другого namespace, целевой PVC оставался в `Pending`, а удаление чужого PVC удаляло восстановленный том. Теперь PersistentVolume заранее привязан к своему целевому PVC."
  - "`VolumeRestoreRequest` для StorageClass с зарезервированными параметрами `csi.storage.k8s.io/`, например для StorageClass модуля csi-nfs, так и не создавал том. Теперь эти параметры убираются перед созданием тома, том получает запрошенный размер, но не меньше размера источника, а при его удалении драйверу передаётся секрет провизионера из StorageClass."
  - "Программы, которые не знают о поле `spec.mode` у `VolumeSnapshot`, например CSI-провизионер, когда он ставит свой защитный финализатор, при полном обновлении объекта удаляли это поле. Для снимка в режиме `Import` такое обновление завершалось ошибкой `mode is immutable`, а PVC, восстанавливаемый из этого снимка, получал `ProvisioningFailed` и оставался в `Pending`. Теперь вебхук сохраняет записанное значение `spec.mode`, если обновление его не содержит, а провизионер меняет только список финализаторов."
  - "CRD `VolumeSnapshot` описывал два поля состояния захвата под именами, которые state-snapshotter не записывает. Поэтому API-сервер отбрасывал их при каждой записи статуса, и state-snapshotter бесконечно повторял согласование (reconcile) каждого `VolumeSnapshot`. Теперь в CRD эти поля называются `childSubtreesManifestsPersisted` и `childrenSettled`."
  - "Контроллер управления данными и вебхук `VolumeSnapshot` не учитывали настройку `logLevel`, а snapshot-controller и data-source-validator всегда работали с самым подробным уровнем журнала klog. Теперь уровень во всех компонентах применяется так, как задан. Уровни `ERROR`, `WARN`, `INFO`, `DEBUG` и `TRACE` соответствуют уровням klog 0, 1, 2, 4 и 5."
  - "`DataImport`, удалённый во время своего первого согласования, навсегда оставлял свои PVC в состоянии `Terminating`, и из-за этого не удалялся их namespace. Теперь контроллер освобождает такие PVC."
  - "`DataImport` завершался ошибкой при каждом согласовании, если API-сервер возвращал размер PVC в другой записи, чем запрошенный, например `3072Mi` вместо `3Gi`, потому что контроллер принимал это за изменение неизменяемой спецификации PVC. Теперь размеры сравниваются по величине."
  - "Если `DataExport` снимка удаляли, пока контроллер был остановлен, или после того, как его финализатор сняли вручную, Pod экспортёра продолжал работать со смонтированным томом и отдавал данные экспорта, которого уже не было. Теперь том экспорта снимка отслеживается так же, как том экспорта рабочего тома, и удаляется."
  - "`DataExport` снимка так и не становился готовым на драйверах, которым нужно воспроизвести журнал файловой системы восстановленного тома, например sds-replicated-volume, потому что восстановленный том монтировался только для чтения. Теперь том экспорта снимка монтируется для чтения и записи, а рабочий том по-прежнему экспортируется только для чтения."

security:
  - "Сервер `DataExport` отдавал файлы за пределами экспортируемого тома, если путь содержал закодированный `..`, например `..%2F..%2Fetc%2Fpasswd`. Любой, кому разрешено скачивать данные экспорта, мог прочитать любой файл контейнера сервера, включая его ключ TLS и токен сервисного аккаунта. Теперь пути, которые выходят за пределы тома, отклоняются."
  - "Сервер `DataImport` создавал файлы за пределами импортируемого тома, если путь содержал закодированный `..`, и в ответ на запрос `HEAD` сообщал размер файла вне тома. Для пути, который указывает на корень тома, он также применял к корню тома владельца, права и время изменения из заголовков запроса. Теперь такие пути отклоняются."
  - "Pod серверов `DataExport` и `DataImport` работают с корневой файловой системой только для чтения, без повышения привилегий, с профилем seccomp `RuntimeDefault` и только с теми возможностями (capabilities) Linux, которые нужны для их работы: `CHOWN`, `DAC_OVERRIDE` и `FOWNER`. Так модуль готов к DKP 1.79, где Pod Security Standards в системных namespace отклоняют Pod, которые им не соответствуют, а не только предупреждают о них."
  - "`golang.org/x/net` обновлён до v0.62.0 во всех компонентах, включая CSI-сайдкары, что закрывает CVE-2026-56851, CVE-2026-78659, CVE-2026-78660, CVE-2026-78661, CVE-2026-78663, CVE-2026-78669, CVE-2026-97032 и CVE-2026-97045."
  - "OpenTelemetry обновлён до v1.45.0 в контроллере, csi-attacher, csi-provisioner, csi-resizer, csi-snapshotter и snapshot-controller, что закрывает CVE-2026-81870."
  - "`cel-go` обновлён до v0.29.0 в вебхуках, что закрывает GHSA-gcjh-h69q-9w9g."
  - "`github.com/klauspost/compress` обновлён до v1.19.2 в хуках, что закрывает CVE-2026-63209."
  - "`github.com/docker/distribution` удалён из хуков, что закрывает CVE-2026-85747."

upgrade_notes:
  - "Модулю теперь нужен модуль state-snapshotter версии v1.0.1 или новее. В кластере с более старым state-snapshotter Deckhouse не обновит storage-foundation, пока не обновится state-snapshotter."
  - "Значение `logLevel` по умолчанию теперь `INFO` вместо `DEBUG`."
  - "На DKP 1.78 и новее прежние роли модуля больше не создаются, и их заменяют роли RBACv2: `d8:system-capability:storage-foundation:view` и `:edit` заменяют `d8:manage:permission:module:storage-foundation:view` и `:edit`, а `d8:namespace-capability:storage-foundation:view`, `:edit` и `:transfer_volume_data` заменяют `d8:use:capability:module:storage-foundation:view`, `:edit` и `:transfer_volume_data`. RoleBinding или ClusterRoleBinding, который ссылается на прежнюю роль по имени, нужно перевести на соответствующую новую. На DKP ниже 1.78 ничего делать не нужно."
  - "Перед обновлением модуля завершите активные загрузки `DataImport` в обоих режимах или будьте готовы загрузить данные заново. Импорт, у которого во время обновления ещё шла загрузка, теряет уже загруженные данные: в режиме `mode: PopulateData` его нужно запустить заново через новый `DataImport`, а в режиме `mode: CreatePVC` импорт продолжается, но данные нужно загрузить ещё раз. Временный PVC, который импорт в режиме `PopulateData` оставил в namespace пользователя, автоматически не удаляется, и его нужно удалить вручную. Завершённые импорты и их артефакты это не затрагивает."
  - "При обновлении удаляется `Deployment` компонента заполнения томов (populator) и перезапускаются Pod csi-controller у модулей CSI-драйверов, которые берут сайдкар провизионера из storage-foundation."

docs:
  - "Документация приведена в соответствие с поведением модуля и перестроена, появилась страница о расширенном использовании. Она описывает сценарии создания и восстановления снимков, клонирования PVC, экспорта и импорта по HTTP, возобновления переноса, а также статусы, ошибки и ограничения `DataExport`, `DataImport`, `VolumeCaptureRequest` и `VolumeRestoreRequest`."
  - "Справочник по кастомным ресурсам полностью переведён на русский язык."
  - "Описаны ответы HTTP API экспорта и импорта, в том числе ответы для файлов, символических ссылок и списков содержимого каталогов."
  - "Документация `VolumeRestoreRequest` описывает, как право исполнителя восстановления попадает в каждый модуль CSI-драйвера."

