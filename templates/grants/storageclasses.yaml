apiVersion: multitenancy.deckhouse.io/v1alpha1
kind: GrantableClusterResourceReference
metadata:
  name: storageclasses-statefulset-claims
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  grantableClusterResourceName: storageclasses
  rule:
    apiGroups:
    - apps
    apiVersions:
    - v1
    resources:
    - statefulsets
  fieldPaths:
  - path: "$.spec.volumeClaimTemplates[?!@.metadata.annotations['volume.beta.kubernetes.io/storage-class']].spec.storageClassName"
    {{- if eq (include "storage-foundation.grants_crd_has" (list . "fieldPathMissingPath")) "true" }}
    missingPath: "$.spec.volumeClaimTemplates[?!@.spec.storageClassName && !@.metadata.annotations['volume.beta.kubernetes.io/storage-class']]"
    {{- end }}
    defaulting: None
    {{- if eq (include "storage-foundation.grants_crd_has" (list . "fieldPathMessage")) "true" }}
    message: >-
      A volume claim template must name a StorageClass that is available to the project, in
      spec.storageClassName or in the volume.beta.kubernetes.io/storage-class annotation, which Kubernetes
      reads first: a template without a class gets the cluster default. An empty storageClassName binds a
      pre-provisioned PersistentVolume and is allowed.
    {{- end }}
---
apiVersion: multitenancy.deckhouse.io/v1alpha1
kind: GrantableClusterResourceReference
metadata:
  name: storageclasses-statefulset-claims-annotation
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  grantableClusterResourceName: storageclasses
  rule:
    apiGroups:
    - apps
    apiVersions:
    - v1
    resources:
    - statefulsets
  fieldPaths:
  - path: "$.spec.volumeClaimTemplates[*].metadata.annotations['volume.beta.kubernetes.io/storage-class']"
    defaulting: None
    {{- if eq (include "storage-foundation.grants_crd_has" (list . "fieldPathMessage")) "true" }}
    message: >-
      Kubernetes takes the StorageClass of a volume claim template from the
      volume.beta.kubernetes.io/storage-class annotation before spec.storageClassName: name a StorageClass
      that is available to the project in the annotation, or remove the annotation and set
      spec.storageClassName.
    {{- end }}
{{- if eq (include "storage-foundation.grants_crd_has" (list . "fieldPathResources")) "true" }}
