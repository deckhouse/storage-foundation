{{- if and (.Values.global.enabledModules | has "multitenancy-manager") (.Capabilities.APIVersions.Has "multitenancy.deckhouse.io/v1alpha1/GrantableClusterResourceDefinition") }}
---
apiVersion: multitenancy.deckhouse.io/v1alpha1
kind: GrantableClusterResourceDefinition
metadata:
  name: storageclasses
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  grantedResource:
    apiGroup: storage.k8s.io
    kind: StorageClass
  enforcement: Managed
  defaultAvailability: All
  defaultFrom:
    annotationKey: storageclass.kubernetes.io/is-default-class
    {{- if eq (include "storage-foundation.grants_crd_has" (list . "defaultFromAdditionalAnnotationKeys")) "true" }}
    additionalAnnotationKeys:
    - storageclass.beta.kubernetes.io/is-default-class
    {{- end }}
  {{- if eq (include "storage-foundation.rbacv2_new_scheme" .) "true" }}
  excluded:
  - matchLabels:
      storage.deckhouse.io/internal: "true"
  {{- end }}
  {{- if eq (include "storage-foundation.grants_crd_has" (list . "catalogFields")) "true" }}
  catalogFields:
  - name: provisioner
    path: $.provisioner
  - name: reclaimPolicy
    path: $.reclaimPolicy
  - name: volumeBindingMode
    path: $.volumeBindingMode
  - name: allowVolumeExpansion
    path: $.allowVolumeExpansion
  {{- end }}
---
apiVersion: multitenancy.deckhouse.io/v1alpha1
kind: GrantableClusterResourceReference
metadata:
  name: storageclasses-pvc
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  grantableClusterResourceName: storageclasses
  rule:
    apiGroups:
    - ""
    apiVersions:
    - v1
    resources:
    - persistentvolumeclaims
  fieldPaths:
  - path: $.spec.storageClassName
    defaulting: Coerce
  {{- if eq (include "storage-foundation.rbacv2_new_scheme" .) "true" }}
  - path: $.metadata.annotations['volume.beta.kubernetes.io/storage-class']
    match:
      fieldPath: $.metadata.annotations['volume.beta.kubernetes.io/storage-class']
    defaulting: None
    {{- if eq (include "storage-foundation.grants_crd_has" (list . "fieldPathMessage")) "true" }}
    message: >-
      Kubernetes takes the StorageClass of a PersistentVolumeClaim from the
      volume.beta.kubernetes.io/storage-class annotation before spec.storageClassName:
      name a StorageClass that is available to the project in the annotation, or remove the annotation
      and set spec.storageClassName.
    {{- end }}
  - path: $.spec.storageClassName
    match:
      fieldPath: $.spec['dataSource','dataSourceRef'].kind
      in:
      - PersistentVolumeClaim
      - VolumeSnapshot
    defaulting: None
    {{- if eq (include "storage-foundation.grants_crd_has" (list . "fieldPathMessage")) "true" }}
    message: >-
      A PersistentVolumeClaim restored from a snapshot or cloned from a volume (spec.dataSource or
      spec.dataSourceRef) keeps its StorageClass and is not switched to the project default:
      specify a StorageClass that is available to the project and served by the CSI driver of the source.
    {{- end }}
  {{- end }}
---
apiVersion: multitenancy.deckhouse.io/v1alpha1
kind: GrantableClusterResourceReference
metadata:
  name: storageclasses-dataimport-pvc
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
spec:
