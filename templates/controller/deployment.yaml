{{- $config := dict
  "valuesKey" "storageFoundation"
  "onMasterNode" false
  "priorityClass" "cluster-medium"
  "controllerMaxMemory" "200Mi"
  "controllerMetricsPort" .Values.storageFoundation.internal.controllerMetricsPort
  "controllerMetricsProxyPort" .Values.storageFoundation.internal.controllerMetricsProxyPort
  "controllerMetricsInProcessAuthorization" true
  "additionalPodAnnotations" (dict
    "checksum/aggregation-api-ca" (.Values.storageFoundation.internal.aggregationApiCert.ca | sha256sum))
  "additionalControllerPorts" (list
    (dict "containerPort" 8443 "name" "https" "protocol" "TCP")
    (dict "containerPort" 8081 "name" "health" "protocol" "TCP")
    (dict "containerPort" 9443 "name" "webhooks" "protocol" "TCP"))
  "additionalControllerEnvs" (list
    (dict "name" "AGGREGATION_API_ADDR" "value" ":8443")
    (dict "name" "AGGREGATION_API_TLS_CERT_FILE" "value" "/etc/aggregation-api-certs/tls.crt")
    (dict "name" "AGGREGATION_API_TLS_KEY_FILE" "value" "/etc/aggregation-api-certs/tls.key")
    (dict "name" "WEBHOOKS_BIND_ADDRESS" "value" ":9443")
    (dict "name" "WEBHOOKS_CERT_DIR" "value" "/etc/webhook/certs"))
  "additionalControllerVolumeMounts" (list
    (dict "name" "aggregation-api-certs" "mountPath" "/etc/aggregation-api-certs" "readOnly" true)
    (dict "name" "webhook-certs" "mountPath" "/etc/webhook/certs" "readOnly" true))
  "additionalVolumes" (list
    (dict "name" "aggregation-api-certs" "secret" (dict "secretName" "controller-https-certs"))
    (dict "name" "webhook-certs" "secret" (dict "secretName" "webhooks-https-certs")))
}}
{{- include "helm_lib_module_controller_manifests" (list . $config) }}
