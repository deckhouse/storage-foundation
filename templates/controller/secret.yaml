---
# Serving certificate of the aggregated API server, mounted into the controller Pod. It is generated by
# the certificate hook (hooks/go/050-aggregation-api-certs); apiservice.yaml advertises the ca of this
# very value as the caBundle, so the trust the aggregation layer is given always matches the certificate
# the server presents.
apiVersion: v1
kind: Secret
metadata:
  name: controller-https-certs
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "controller")) | nindent 2 }}
type: kubernetes.io/tls
data:
  ca.crt: {{ .Values.storageFoundation.internal.aggregationApiCert.ca | b64enc | quote }}
  tls.crt: {{ .Values.storageFoundation.internal.aggregationApiCert.crt | b64enc | quote }}
  tls.key: {{ .Values.storageFoundation.internal.aggregationApiCert.key | b64enc | quote }}
