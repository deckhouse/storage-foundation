{{- $dhVersionIsDev := or (hasPrefix "dev" .Values.global.deckhouseVersion) (hasSuffix "dev" .Values.global.deckhouseVersion) }}
{{- $originIngressNamespace := "d8-user-authn" }}
{{- if or $dhVersionIsDev (semverCompare ">=1.77" .Values.global.deckhouseVersion) }}
{{- $originIngressNamespace = "kube-system" }}
{{- end }}

{{- $config := dict
  "fullname" "data-manager-controller"
  "valuesKey" "storageFoundation"
  "onMasterNode" false
  "priorityClass" "cluster-medium"
  "controllerImageName" "dataManagerController"
  "controllerMaxMemory" "100Mi"
  "controllerMetricsPort" .Values.storageFoundation.internal.dataManagerMetricsPort
  "controllerMetricsProxyPort" .Values.storageFoundation.internal.dataManagerMetricsProxyPort
  "controllerMetricsInProcessAuthorization" true
  "additionalControllerEnvs" (list
    (dict "name" "ORIGIN_INGRESS_NAMESPACE" "value" $originIngressNamespace)
    (dict "name" "HA_MODE" "value" (include "helm_lib_is_ha_to_value" (list . "true" "false")))
    (dict "name" "ingressClassName" "value" (include "helm_lib_module_ingress_class" .))
    (dict "name" "ingressPublicDomain" "value" (include "helm_lib_module_public_domain" (list . "%s"))))
}}
{{- include "helm_lib_module_controller_manifests" (list . $config) }}
