{{- define "data_manager_controller_resources" }}
cpu: 10m
memory: 25Mi
{{- end }}

{{- $dhVersionIsDev := or (hasPrefix "dev" .Values.global.deckhouseVersion) (hasSuffix "dev" .Values.global.deckhouseVersion) }}
{{- $originIngressNamespace := "d8-user-authn" }}
{{- if or $dhVersionIsDev (semverCompare ">=1.77" .Values.global.deckhouseVersion) }}
{{- $originIngressNamespace = "kube-system" }}
{{- end }}

{{- if (include "helm_lib_api_version_exists" (list . "autoscaling.k8s.io/v1/VerticalPodAutoscaler")) }}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: data-manager-controller
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "data-manager-controller")) | nindent 2 }}
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: data-manager-controller
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
  resourcePolicy:
    containerPolicies:
    {{- include "helm_lib_vpa_kube_rbac_proxy_resources" . | nindent 4 }}
    - containerName: "data-manager-controller"
      minAllowed:
        {{- include "data_manager_controller_resources" . | nindent 8 }}
      maxAllowed:
        cpu: 200m
        memory: 100Mi
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: data-manager-controller
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "data-manager-controller" )) | nindent 2 }}
spec:
  minAvailable: {{ include "helm_lib_is_ha_to_value" (list . 1 0) }}
  selector:
    matchLabels:
      app: data-manager-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-manager-controller
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "data-manager-controller")) | nindent 2 }}
spec:
  revisionHistoryLimit: 2
  {{- include "helm_lib_deployment_strategy_and_replicas_for_ha" . | nindent 2 }}
  selector:
    matchLabels:
      app: data-manager-controller
  template:
    metadata:
      labels:
        app: data-manager-controller
    spec:
      {{- include "helm_lib_priority_class" (tuple . "cluster-medium") | nindent 6 }}
      {{- include "helm_lib_node_selector" (tuple . "system") | nindent 6 }}
      {{- include "helm_lib_tolerations" (tuple . "system") | nindent 6 }}
      {{- include "helm_lib_module_pod_security_context_run_as_user_nobody" . | nindent 6 }}
      {{- include "helm_lib_pod_anti_affinity_for_ha" (list . (dict "app" "data-manager-controller")) | nindent 6 }}
      imagePullSecrets:
        - name: {{ .Chart.Name }}-module-registry
      serviceAccountName: data-manager-controller
      containers:
        - name: data-manager-controller
          {{- include "helm_lib_module_container_security_context_pss_restricted_flexible" (dict "ro" true "seccompProfile" true) | nindent 10 }}
          image: {{ include "helm_lib_module_image" (list . "dataManagerController") }}
          imagePullPolicy: IfNotPresent
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 5
            failureThreshold: 2
            periodSeconds: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
              scheme: HTTP
            periodSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              {{- include "helm_lib_module_ephemeral_storage_only_logs" . | nindent 14 }}
{{- if not (include "helm_lib_api_version_exists" (list . "autoscaling.k8s.io/v1/VerticalPodAutoscaler")) }}
              {{- include "data_manager_controller_resources" . | nindent 14 }}
{{- end }}
          env:
            - name: LOG_LEVEL
              value: {{ include "helm_lib_module_controller_log_level" (list . "storageFoundation") | quote }}
            {{- /*
              Loopback: controller-runtime binds :8080 whenever this is empty, so this
              manager has always served metrics on every interface of the pod, with no
              port declared and nothing scraping it. The kube-rbac-proxy below is what
              publishes them now.
            */}}
            - name: METRICS_BIND_ADDRESS
              value: "127.0.0.1:{{ .Values.storageFoundation.internal.dataManagerMetricsPort }}"
            - name: CONTROLLER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ORIGIN_INGRESS_NAMESPACE
              value: {{ $originIngressNamespace | quote }}
            - name: HA_MODE
              value: {{ include "helm_lib_is_ha_to_value" (list . "true" "false") | quote }}
            - name: ingressClassName
              value: {{ include "helm_lib_module_ingress_class" . | quote }}
            - name: ingressPublicDomain
              value: {{ include "helm_lib_module_public_domain" (list . "%s") | quote }}
        - name: kube-rbac-proxy
          {{- include "helm_lib_module_container_security_context_pss_restricted_flexible" dict | nindent 10 }}
          image: {{ include "helm_lib_module_common_image" (list . "kubeRbacProxy") }}
          imagePullPolicy: IfNotPresent
          args:
            - "--secure-listen-address=$(KUBE_RBAC_PROXY_LISTEN_ADDRESS):{{ .Values.storageFoundation.internal.dataManagerMetricsProxyPort }}"
            - "--v=2"
            - "--logtostderr=true"
            - "--stale-cache-interval=1h30m"
            - "--livez-path=/livez"
          env:
            - name: KUBE_RBAC_PROXY_LISTEN_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: KUBE_RBAC_PROXY_CONFIG
              value: |
                excludePaths:
                - /livez
                upstreams:
                - upstream: http://127.0.0.1:{{ .Values.storageFoundation.internal.dataManagerMetricsPort }}/metrics
                  path: /metrics
                  authorization:
                    resourceAttributes:
                      namespace: d8-{{ .Chart.Name }}
                      apiGroup: apps
                      apiVersion: v1
                      resource: deployments
                      subresource: prometheus-metrics
                      name: data-manager-controller
          ports:
            - name: https-metrics
              containerPort: {{ .Values.storageFoundation.internal.dataManagerMetricsProxyPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /livez
              port: {{ .Values.storageFoundation.internal.dataManagerMetricsProxyPort }}
              scheme: HTTPS
          {{- /* No readinessProbe on purpose: readiness of the pod gates the endpoints of
                 its Services, and a sidecar that only serves metrics must not be able to take
                 the webhook or the APIService of this pod out of rotation. A proxy that wedges
                 is restarted by the liveness probe, and a proxy that is not up yet is kept out
                 of the scrape targets by the readiness filter in the PodMonitor/ServiceMonitor. */}}
          resources:
            requests:
              {{- include "helm_lib_module_ephemeral_storage_only_logs" . | nindent 14 }}
              {{- if not (include "helm_lib_api_version_exists" (list . "autoscaling.k8s.io/v1/VerticalPodAutoscaler")) }}
              {{- include "helm_lib_container_kube_rbac_proxy_resources" . | nindent 14 }}
              {{- end }}
