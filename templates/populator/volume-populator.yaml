---
# The data-manager controller sets spec.dataSourceRef on every PVC it creates in CreatePVC mode, naming
# DataImport.storage-foundation.deckhouse.io. That field tells a StorageClass's own provisioner not to
# dynamically provision the claim; the controller fills the volume and hands it over itself, with no
# populator component and no controller reading this object to do so. What DOES read it is
# volume-data-source-validator: it lists VolumePopulator objects and, on no match for a PVC's
# dataSourceRef, emits a Warning event UnrecognizedDataSourceKind. This registration is what keeps that
# event off every PVC the CreatePVC mode creates — sourceKind must keep matching the GroupKind the
# controller sets.
apiVersion: populator.storage.k8s.io/v1beta1
kind: VolumePopulator
metadata:
  name: dataimport
  {{- include "helm_lib_module_labels" (list . (dict "app" "populator")) | nindent 2 }}
sourceKind:
  group: storage-foundation.deckhouse.io
  kind: DataImport
