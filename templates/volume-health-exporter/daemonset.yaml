{{- define "volume_health_exporter_resources" }}
cpu: 10m
memory: 25Mi
{{- end }}

{{- if (include "helm_lib_api_version_exists" (list . "autoscaling.k8s.io/v1/VerticalPodAutoscaler")) }}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: volume-health-exporter
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "volume-health-exporter")) | nindent 2 }}
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: DaemonSet
    name: volume-health-exporter
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
  resourcePolicy:
    containerPolicies:
    - containerName: "volume-health-exporter"
      minAllowed:
        {{- include "volume_health_exporter_resources" . | nindent 8 }}
      maxAllowed:
        cpu: 50m
        memory: 64Mi
{{- end }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: volume-health-exporter
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "volume-health-exporter")) | nindent 2 }}
spec:
  selector:
    matchLabels:
      app: volume-health-exporter
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 10%
  template:
    metadata:
      labels:
        app: volume-health-exporter
        {{- if .Values.global.enabledModules | has "admission-policy-engine" }}
        security.deckhouse.io/security-policy-exception: volume-health-exporter
        {{- end }}
    spec:
      {{- include "helm_lib_priority_class" (tuple . "cluster-medium") | nindent 6 }}
      {{- include "helm_lib_tolerations" (tuple . "any-node") | nindent 6 }}
      {{- include "helm_lib_module_pod_security_context_run_as_user_root" . | nindent 6 }}
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: volume-health-exporter
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: {{ .Chart.Name }}-module-registry
      containers:
        - name: volume-health-exporter
          image: {{ include "helm_lib_module_image" (list . "volumeHealthExporter") }}
          imagePullPolicy: IfNotPresent
          args:
            - -kubelet-root-dir=/var/lib/kubelet
            - -textfile=/var/run/node-exporter-textfile/storage-foundation-volume-health.prom
            - -status-file=/run/volume-health-exporter/status.json
            - -interval=30s
          {{- include "helm_lib_module_container_security_context_read_only_root_filesystem_capabilities_drop_all" . | nindent 10 }}
          livenessProbe:
            exec:
              command:
                - /volume-health-exporter
                - -status-file=/run/volume-health-exporter/status.json
                - -interval=30s
                - -probe=liveness
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /volume-health-exporter
                - -status-file=/run/volume-health-exporter/status.json
                - -interval=30s
                - -probe=readiness
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: kubelet-pods
              mountPath: /var/lib/kubelet/pods
              readOnly: true
              mountPropagation: HostToContainer
            - name: kubelet-csi-staging
              mountPath: /var/lib/kubelet/plugins/kubernetes.io/csi
              readOnly: true
              mountPropagation: HostToContainer
            - name: textfile
              mountPath: /var/run/node-exporter-textfile
            - name: status
              mountPath: /run/volume-health-exporter
          resources:
            requests:
              {{- include "helm_lib_module_ephemeral_storage_only_logs" . | nindent 14 }}
              {{- if not (include "helm_lib_api_version_exists" (list . "autoscaling.k8s.io/v1/VerticalPodAutoscaler")) }}
              {{- include "volume_health_exporter_resources" . | nindent 14 }}
              {{- end }}
      volumes:
        - name: kubelet-pods
          hostPath:
            path: /var/lib/kubelet/pods
            type: Directory
        - name: kubelet-csi-staging
          hostPath:
            path: /var/lib/kubelet/plugins/kubernetes.io/csi
            type: DirectoryOrCreate
        - name: textfile
          hostPath:
            path: /var/run/node-exporter-textfile
            type: DirectoryOrCreate
        - name: status
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
