{{- if eq (include "storage-foundation.rbacv2_new_scheme" .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  creationTimestamp: null
  labels:
    heritage: deckhouse
    module: storage-foundation
    rbac.deckhouse.io/aggregate-to-infrastructure-as: viewer
    rbac.deckhouse.io/aggregate-to-storage-as: viewer
    rbac.deckhouse.io/kind: capability
    rbac.deckhouse.io/capability: "system-capability.storage-foundation.view"
    rbac.deckhouse.io/scope: system
    rbac.deckhouse.io/namespace: d8-storage-foundation
  name: d8:system-capability:storage-foundation:view
  annotations:
    en.meta.deckhouse.io/title: "Module storage-foundation: view configuration and cluster resources"
    ru.meta.deckhouse.io/title: "Модуль storage-foundation: просмотр конфигурации и кластерных ресурсов"
    en.meta.deckhouse.io/description: "Read-only access to the storage-foundation module configuration and to the cluster-scoped VolumeSnapshotClass and VolumeSnapshotContent resources."
    ru.meta.deckhouse.io/description: "Доступ только на чтение к конфигурации модуля storage-foundation и к кластерным ресурсам VolumeSnapshotClass и VolumeSnapshotContent."
rules:
- apiGroups:
  - deckhouse.io
  resourceNames:
  - storage-foundation
  resources:
  - moduleconfigs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - snapshot.storage.k8s.io
  resources:
  - volumesnapshotclasses
  - volumesnapshotcontents
  verbs:
  - get
  - list
  - watch
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  creationTimestamp: null
  labels:
    heritage: deckhouse
    module: storage-foundation
    rbac.deckhouse.io/aggregate-to-infrastructure-as: viewer
    rbac.deckhouse.io/aggregate-to-storage-as: viewer
    rbac.deckhouse.io/kind: manage
    rbac.deckhouse.io/level: module
    rbac.deckhouse.io/namespace: d8-storage-foundation
  name: d8:manage:permission:module:storage-foundation:view
rules:
- apiGroups:
  - deckhouse.io
  resourceNames:
  - storage-foundation
  resources:
  - moduleconfigs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - snapshot.storage.k8s.io
  resources:
  - volumesnapshotclasses
  - volumesnapshotcontents
  verbs:
  - get
  - list
  - watch
{{- end }}
