{{- if eq (include "storage-foundation.rbacv2_new_scheme" .) "true" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: d8:system-capability:storage-foundation:edit
  labels:
    heritage: deckhouse
    module: storage-foundation
    rbac.deckhouse.io/aggregate-to-storage-as: manager
    rbac.deckhouse.io/capability: system-capability.storage-foundation.edit
    rbac.deckhouse.io/kind: capability
    rbac.deckhouse.io/namespace: d8-storage-foundation
    rbac.deckhouse.io/scope: system
  annotations:
    en.meta.deckhouse.io/description: "Manage the storage-foundation module configuration and the cluster-scoped VolumeSnapshotClass and VolumeSnapshotContent resources."
    en.meta.deckhouse.io/title: "Module storage-foundation: edit configuration and cluster resources"
    ru.meta.deckhouse.io/description: "Управление конфигурацией модуля storage-foundation и кластерными ресурсами VolumeSnapshotClass и VolumeSnapshotContent."
    ru.meta.deckhouse.io/title: "Модуль storage-foundation: управление конфигурацией и кластерными ресурсами"
rules:
- apiGroups:
  - deckhouse.io
  resources:
  - moduleconfigs
  resourceNames:
  - storage-foundation
  verbs:
  - create
  - delete
  - patch
  - update
- apiGroups:
  - snapshot.storage.k8s.io
  resources:
  - volumesnapshotclasses
  verbs:
  - create
  - delete
  - deletecollection
  - patch
  - update
- apiGroups:
  - snapshot.storage.k8s.io
  resources:
  - volumesnapshotcontents
  verbs:
  - create
  - delete
  - deletecollection
  - patch
  - update
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  creationTimestamp: null
  labels:
    heritage: deckhouse
    module: storage-foundation
    rbac.deckhouse.io/aggregate-to-infrastructure-as: manager
    rbac.deckhouse.io/aggregate-to-storage-as: manager
    rbac.deckhouse.io/kind: manage
    rbac.deckhouse.io/level: module
    rbac.deckhouse.io/namespace: d8-storage-foundation
  name: d8:manage:permission:module:storage-foundation:edit
rules:
- apiGroups:
  - deckhouse.io
  resourceNames:
  - storage-foundation
  resources:
  - moduleconfigs
  verbs:
  - create
  - update
  - patch
  - delete
- apiGroups:
  - snapshot.storage.k8s.io
  resources:
  - volumesnapshotclasses
  - volumesnapshotcontents
  verbs:
  - create
  - delete
  - deletecollection
  - patch
  - update
{{- end }}
