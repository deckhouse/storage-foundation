{{- if eq (include "storage-foundation.rbacv2_new_scheme" .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: storage-foundation
    rbac.deckhouse.io/aggregate-to-namespace-as: viewer
    rbac.deckhouse.io/kind: capability
    rbac.deckhouse.io/capability: "namespace-capability.storage-foundation.view"
    rbac.deckhouse.io/scope: namespace
  name: d8:namespace-capability:storage-foundation:view
  annotations:
    en.meta.deckhouse.io/title: "Module storage-foundation: view"
    ru.meta.deckhouse.io/title: "Модуль storage-foundation: просмотр"
    en.meta.deckhouse.io/description: "Read-only access to the VolumeCaptureRequest, VolumeRestoreRequest, DataExport, DataImport and VolumeSnapshot resources in a namespace."
    ru.meta.deckhouse.io/description: "Доступ только на чтение к ресурсам VolumeCaptureRequest, VolumeRestoreRequest, DataExport, DataImport и VolumeSnapshot в пространстве имён."
rules:
  - apiGroups:
      - storage-foundation.deckhouse.io
    resources:
      - volumecapturerequests
      - volumerestorerequests
      - dataexports
      - dataimports
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - snapshot.storage.k8s.io
    resources:
      - volumesnapshots
    verbs:
      - get
      - list
      - watch
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: storage-foundation
    rbac.deckhouse.io/aggregate-to-kubernetes-as: viewer
    rbac.deckhouse.io/kind: use
  name: d8:use:capability:module:storage-foundation:view
rules:
  - apiGroups:
      - storage-foundation.deckhouse.io
    resources:
      - volumecapturerequests
      - volumerestorerequests
      - dataexports
      - dataimports
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - snapshot.storage.k8s.io
    resources:
      - volumesnapshots
    verbs:
      - get
      - list
      - watch
{{- end }}
