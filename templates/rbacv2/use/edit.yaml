{{- if eq (include "storage-foundation.rbacv2_new_scheme" .) "true" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: d8:namespace-capability:storage-foundation:edit
  labels:
    heritage: deckhouse
    module: storage-foundation
    rbac.deckhouse.io/aggregate-to-namespace-as: manager
    rbac.deckhouse.io/capability: namespace-capability.storage-foundation.edit
    rbac.deckhouse.io/kind: capability
    rbac.deckhouse.io/scope: namespace
  annotations:
    en.meta.deckhouse.io/description: "Manage storage-foundation resources in a namespace."
    en.meta.deckhouse.io/title: "Module storage-foundation: edit"
    ru.meta.deckhouse.io/description: "Управление ресурсами модуля storage-foundation в пространстве имён."
    ru.meta.deckhouse.io/title: "Модуль storage-foundation: редактирование"
rules:
- apiGroups:
  - snapshot.storage.k8s.io
  resources:
  - volumesnapshots
  verbs:
  - create
  - delete
  - deletecollection
  - patch
  - update
- apiGroups:
  - storage-foundation.deckhouse.io
  resources:
  - dataexports
  verbs:
  - create
  - delete
  - deletecollection
  - patch
  - update
- apiGroups:
  - storage-foundation.deckhouse.io
  resources:
  - dataimports
  verbs:
  - create
  - delete
  - deletecollection
  - patch
  - update
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: storage-foundation
    rbac.deckhouse.io/aggregate-to-kubernetes-as: manager
    rbac.deckhouse.io/kind: use
  name: d8:use:capability:module:storage-foundation:edit
rules:
  - apiGroups:
      - storage-foundation.deckhouse.io
    resources:
      - dataexports
      - dataimports
    verbs:
      - create
      - update
      - patch
      - delete
      - deletecollection
  - apiGroups:
      - snapshot.storage.k8s.io
    resources:
      - volumesnapshots
    verbs:
      - create
      - delete
      - deletecollection
      - patch
      - update
{{- end }}
