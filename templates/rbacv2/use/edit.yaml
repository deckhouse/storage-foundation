{{- if eq (include "storage-foundation.rbacv2_new_scheme" .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: storage-foundation
    rbac.deckhouse.io/aggregate-to-namespace-as: manager
    rbac.deckhouse.io/kind: capability
    rbac.deckhouse.io/capability: "namespace-capability.storage-foundation.edit"
    rbac.deckhouse.io/scope: namespace
  name: d8:namespace-capability:storage-foundation:edit
  annotations:
    en.meta.deckhouse.io/title: "Module storage-foundation: edit"
    ru.meta.deckhouse.io/title: "Модуль storage-foundation: редактирование"
    en.meta.deckhouse.io/description: "Create, change and delete the VolumeCaptureRequest, VolumeRestoreRequest, DataExport, DataImport and VolumeSnapshot resources in a namespace. Transferring volume data itself is a separate capability."
    ru.meta.deckhouse.io/description: "Создание, изменение и удаление ресурсов VolumeCaptureRequest, VolumeRestoreRequest, DataExport, DataImport и VolumeSnapshot в пространстве имён. Сам перенос данных томов выдаётся отдельной возможностью."
rules:
  - apiGroups:
      - storage-foundation.deckhouse.io
    resources:
      - volumecapturerequests
      - volumerestorerequests
      - dataexports
      - dataimports
    verbs:
      - create
      - update
      - patch
      - delete
      - deletecollection
  - apiGroups:
      - snapshot.storage.k8s.io
    resources:
      - volumesnapshots
    verbs:
      - create
      - delete
      - deletecollection
      - patch
      - update
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: storage-foundation
    rbac.deckhouse.io/aggregate-to-kubernetes-as: manager
    rbac.deckhouse.io/kind: use
  name: d8:use:capability:module:storage-foundation:edit
rules:
  - apiGroups:
      - storage-foundation.deckhouse.io
    resources:
      - volumecapturerequests
      - volumerestorerequests
      - dataexports
      - dataimports
    verbs:
      - create
      - update
      - patch
      - delete
      - deletecollection
  - apiGroups:
      - snapshot.storage.k8s.io
    resources:
      - volumesnapshots
    verbs:
      - create
      - delete
      - deletecollection
      - patch
      - update
{{- end }}
