---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: "d8-{{ .Chart.Name }}-volume-snapshot-mutation"
  labels:
    heritage: deckhouse
    module: storage-foundation
  annotations:
    # Deploy the webhook only after its backing Service+Deployment are ready: with failurePolicy: Fail a
    # partial rollout (network issue, OOM) must not leave the webhook without a backend, which would block
    # every matching VolumeSnapshot CREATE and UPDATE.
    werf.io/deploy-dependency-controller: state=ready,kind=Deployment,name=controller,namespace=d8-{{ .Chart.Name }}
    werf.io/deploy-dependency-service: state=present,kind=Service,name=webhooks,namespace=d8-{{ .Chart.Name }}
webhooks:
  - name: "d8-{{ .Chart.Name }}-volume-snapshot-mutation.storage-foundation.deckhouse.io"
    failurePolicy: Fail
    rules:
      - apiGroups: ["snapshot.storage.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["volumesnapshots"]
        scope: "Namespaced"
    # Only PVC-source creates (origin, snapshot class) and requests without spec.mode (no schema default) reach
    # the mutator; a create with neither mode nor source is left to the schema, which rejects it.
    matchConditions:
      - name: pvc-source-create-or-missing-mode
        expression: "(request.operation == 'CREATE' && has(object.spec.source) && has(object.spec.source.persistentVolumeClaimName)) || (!has(object.spec.mode) && (request.operation == 'UPDATE' || has(object.spec.source)))"
    clientConfig:
      service:
        namespace: "d8-{{ .Chart.Name }}"
        name: "webhooks"
        path: "/volume-snapshot-mutate"
      caBundle: {{ .Values.storageFoundation.internal.customWebhookCert.ca | b64enc | quote }}
    admissionReviewVersions: ["v1", "v1beta1"]
    sideEffects: None
    timeoutSeconds: 10
