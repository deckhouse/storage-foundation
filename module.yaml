name: storage-foundation
stage: "General Availability"
subsystems:
  - storage
namespace: d8-storage-foundation
descriptions:
  en: "Enables snapshot support, volume cloning, and secure HTTP-based export and import of persistent volume contents for compatible CSI drivers in a Kubernetes cluster."
  ru: "Включает поддержку снимков, клонирования томов и безопасного экспорта и импорта содержимого постоянных томов по HTTP для совместимых CSI-драйверов в кластере Kubernetes."
requirements:
  deckhouse: ">= 1.76.9"
  modules:
    # The snapshot domain (SnapshotContent/VRR) lives in state-snapshotter. 1.0.1 is the first release
    # whose ClusterRole d8:state-snapshotter:backup-agent aggregates the roles labelled
    # state-snapshotter.deckhouse.io/aggregate-to-backup-agent. On DKP 1.78 and later that label is the
    # only way templates/rbacv2/use/transfer_volume_data.yaml reaches a backup agent, so with an older
    # state-snapshotter the agent would lose the DataExport/DataImport transfer permissions.
    state-snapshotter: ">= 1.0.1"
    # A gate, not a dependency: storage-foundation never needs snapshot-controller (it embeds its
    # own copy of the controller). But snapshot-controller builds older than v0.2.0 ship an older
    # schema of the shared snapshot.storage.k8s.io CRDs — running one NEXT TO storage-foundation
    # makes the two modules rewrite those CRDs with different content on every converge, and the
    # older schema prunes the newer status.data fields. v0.2.0 is the first build that keeps its
    # CRD copies byte-identical, empties itself while storage-foundation is enabled, and drops the
    # module-disable hook that stripped finalizers from live VolumeSnapshot objects. `!optional`
    # means: ignored when the snapshot-controller module is absent or disabled; while an OLDER
    # snapshot-controller is enabled, storage-foundation refuses to enable or update, and unblocks
    # itself once v0.2.0 arrives on that module's release channel.
    snapshot-controller: ">= 0.2.0 !optional"
disable:
  confirmation: true
  message: |
    Attention!

    Disabling this module stops the snapshot controller embedded in it and the controllers that run data export and import and volume restore. After that:

    - VolumeSnapshot objects and PersistentVolumeClaim clones from snapshots are no longer processed.
    - DataExport and DataImport resources are no longer processed, and running exports and imports stop.
    - VolumeRestoreRequest resources and the namespace snapshots of the state-snapshotter module that rely on them stop working.
    - With multitenancy-manager enabled, the `volumesnapshotclasses` grant and the DataImport and VolumeRestoreRequest references are removed, so a ClusterResourceGrantPolicy no longer restricts VolumeSnapshotClass in projects. The `storageclasses` grant stays and is taken over by multitenancy-manager.

    Before disabling the module, make sure that no snapshots, exports, imports or restores are in progress and that nothing in the cluster depends on them. Enable the module again to restore the restrictions on VolumeSnapshotClass.
accessibility:
  editions:
    _default:
      available: true
      enabledInBundles:
        - Default
        - Managed
