# The module RBAC declaration, read from the RBAC objects the module renders. Review it: every TODO is a
# decision "dmt lint" reports; then run "dmt lint --linter rbac --fix" to bring the templates in line with it.
# Objects rendered only under values other than the defaults are not here: lint with --values-file (or
# --matrix) before the first --fix of the templates if the module has such templates, and declare them with when.
#
# Notes:
# - ServiceAccount controller mounted its token (automountServiceAccountToken unset or true); kept as true -- set false once its pods mount the token themselves
# - ServiceAccount data-exporter mounted its token (automountServiceAccountToken unset or true); kept as true -- set false once its pods mount the token themselves
# - ServiceAccount data-manager-controller mounted its token (automountServiceAccountToken unset or true); kept as true -- set false once its pods mount the token themselves
# - ServiceAccount data-source-validator mounted its token (automountServiceAccountToken unset or true); kept as true -- set false once its pods mount the token themselves
# - ServiceAccount webhooks mounted its token (automountServiceAccountToken unset or true); kept as true -- set false once its pods mount the token themselves
#
# Not described by the declaration (stays hand-written, as it is):
# - kube-system/Role/d8:storage-foundation:data-manager-controller (templates/data-manager-controller/rbac-for-us.yaml): bindRoles of data-manager-controller binds it, and the declaration names the Role without writing it -- move it to a template the declaration does not write: --fix leaves templates/data-manager-controller/rbac-for-us.yaml as it is while the Role is there
