capabilities:
  namespace.transfer_volume_data:
    level: manager
    labels:
      state-snapshotter.deckhouse.io/aggregate-to-backup-agent: "true"
    title:
      en: 'Module storage-foundation: transfer volume data'
      ru: 'Модуль storage-foundation: перенос данных томов'
    description:
      en: 'Move the contents of a volume out of the cluster and back in over HTTP: create, read and delete DataExport and DataImport resources in a namespace and call their download subresources.'
      ru: 'Перенос содержимого тома из кластера и обратно по HTTP: создание, чтение и удаление ресурсов DataExport и DataImport в пространстве имён и обращение к их субресурсам download.'
