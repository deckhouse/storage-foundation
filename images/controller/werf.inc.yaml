---
# do not remove this image: used in external audits (DKP CSE)
image: {{ .ModuleNamePrefix }}{{ .ImageName }}-src-artifact
from: {{ index $.Images "builder/src" }}
final: false

git:
  - add: {{ .ModuleDir }}/api
    to: /src/api
    stageDependencies:
      install:
        - '**/*'
  - add: {{ .ModuleDir }}/common
    to: /src/common
    stageDependencies:
      install:
        - '**/*'
  - add: {{ .ModuleDir }}/images/{{ $.ImageName }}
    to: /src/images/{{ $.ImageName }}
    stageDependencies:
      install:
        - '**/*'
    excludePaths:
      - werf.inc.yaml
  - add: {{ .ModuleDir }}/images/webhooks
    to: /src/images/webhooks
    stageDependencies:
      install:
        - '**/*'
    excludePaths:
      - werf.inc.yaml

shell:
  install:
    - rm -rf /src/.git

---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}-golang-artifact
from: {{ index $.Images "builder/golang" }}
final: false

import:
  - image: {{ .ModuleNamePrefix }}{{ .ImageName }}-src-artifact
    add: /src
    to: /src
    before: setup

mount:
{{ include "mount points for golang builds" . }}

secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
{{ include "secret for private go modules" . }}

shell:
  setup:
    {{- include "svace toolchain for golang builds" . | nindent 4 }}
    {{- include "auth for private go modules" . | nindent 4 }}
    - cd /src/images/{{ $.ImageName }}
    - GOPROXY=$(cat /run/secrets/GOPROXY) go mod download
    - export GOOS=linux GOARCH=amd64 CGO_ENABLED=0
    - |
      {{- include "image-build.build" (set $ "BuildCommand" (printf `go build -ldflags="-s -w" -o /%s ./cmd` $.ImageName)) | nindent 6 }}
    - chmod 0755 /{{ $.ImageName }}

---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}
from: {{ index $.Images "base/distroless" }}
fromCacheVersion: "1"

import:
  - image: {{ .ModuleNamePrefix }}{{ .ImageName }}-golang-artifact
    add: /{{ $.ImageName }}
    to: /{{ $.ImageName }}
    before: setup

imageSpec:
  config:
    entrypoint: ["/{{ $.ImageName }}"]

{{- /*
Attach an OpenVEX attestation to the controller image so trivy suppresses the unfixable
golang.org/x/crypto/openpgp advisory (GO-2026-5932) reported against the controller binary.
The dependency arrives with the module's aggregated API server; nothing else in this binary
uses golang.org/x/crypto. Predicate: /images/controller/known_vulnerabilities.vex (per the
"vex mitigation" template) — the root predicate is attached to the bundle image, which does
not carry this binary.
*/ -}}
{{- include "vex mitigation" (list $ $.ImageName) }}
