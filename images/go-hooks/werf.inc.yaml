---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}-artifact
from: {{ index $.Images (eq .SVACE_ENABLED "false" | ternary "builder/golang" "builder/alpine-svace") }}
final: false

git:
  - add: {{ .ModuleDir }}/hooks/go
    to: /usr/src/app/hooks/go
    stageDependencies:
      # Fetch and build in ONE stage. Splitting them puts the credentials this build
      # needs into the earlier stage's layer, where they outlive the pipeline that
      # issued them: the module cache lives on a mount and never survives the stage,
      # so the build always reaches the network, and it reaches it with whatever
      # token the cached layer was baked with. The three sibling images fetch and
      # build in a single stage for the same reason.
      beforeSetup:
        - '**/go.mod'
        - '**/go.sum'
        - '**/*.go'

mount:
{{ include "mount points for golang builds" . }}

secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
{{ include "secret for private go modules" . }}

shell:
  beforeSetup:
    {{- include "auth for private go modules" . | nindent 4 }}
    - cd /usr/src/app/hooks/go
    - GOPROXY=$(cat /run/secrets/GOPROXY) go mod download
    - |
      cd /usr/src/app/hooks/go;
      export CGO_ENABLED=0
      {{- include "image-build.build" (set $ "BuildCommand" `go build -a -gcflags=all="-l -B" -ldflags="-w -s" -o /go-hooks *.go;`) | nindent 6 }}
