x-extend:
  schema: config-values.yaml
type: object
properties:
  internal:
    type: object
    default: {}
    properties:
      populatorMetricsPort:
        type: integer
        default: 8080
        description: |
          The port the populator serves its metrics on, bound on 127.0.0.1: the
          kube-rbac-proxy of the same pod is the only thing that reaches it. What is on
          it is what the populator machinery exports -- volume_populator_operation_seconds
          and volume_populator_operations_in_flight.
      populatorMetricsProxyPort:
        type: integer
        default: 8080
        description: |
          The port the kube-rbac-proxy publishes the populator metrics on. Reaching it
          requires "get" on deployments/prometheus-metrics for the populator.
      controllerMetricsPort:
        type: integer
        default: 8080
        description: |
          The port the controller serves its metrics on, bound on 127.0.0.1: the only
          thing that reaches it is the kube-rbac-proxy of the same pod.
      controllerMetricsProxyPort:
        type: integer
        default: 8080
        description: |
          The port the kube-rbac-proxy publishes the controller metrics on. Reaching
          it requires "get" on deployments/prometheus-metrics for the controller.
      dataManagerMetricsPort:
        type: integer
        default: 8080
        description: |
          The same pair for data-manager-controller.
      dataManagerMetricsProxyPort:
        type: integer
        default: 8080
        description: |
          The port the kube-rbac-proxy publishes the data-manager metrics on.
      snapshotValidationWebhookCert:
        type: object
        default: {}
        x-required-for-helm:
          - crt
          - key
          - ca
        properties:
          crt:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          key:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          ca:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
      customWebhookCert:
        type: object
        default: {}
        x-required-for-helm:
          - crt
          - key
          - ca
        properties:
          crt:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          key:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          ca:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
      aggregationApiCert:
        type: object
        default: {}
        description: "Self-signed serving certificate of the module's aggregated API server, generated by the certificate hook. Its SANs cover the controller Service; crt/key are mounted into the controller Pod and ca is the caBundle both APIServices advertise."
        x-required-for-helm:
