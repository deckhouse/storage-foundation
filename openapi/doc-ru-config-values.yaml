      Ручное управление режимом отказоустойчивости.

      По умолчанию режим отказоустойчивости определяется автоматически. Подробнее о [режиме отказоустойчивости модулей](/products/kubernetes-platform/documentation/v1/reference/api/global.html#parameters-highavailability).
