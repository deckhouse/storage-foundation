type: object
properties:
  logLevel:
    type: string
    enum:
      - ERROR
      - WARN
      - INFO
      - DEBUG
      - TRACE
    description: Logging level for the module components.
    default: INFO
  highAvailability:
    type: boolean
    x-examples: [true, false]
    description: |
      Manually enable the high availability mode.

      By default, Deckhouse automatically decides whether to enable the HA mode. See [high availability mode for modules](/products/kubernetes-platform/documentation/v1/reference/api/global.html#parameters-highavailability) for details.
